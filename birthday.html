    ctx.font = '200 ' + Math.round(fs) + 'px "Helvetica Neue",Arial,sans-serif';
    var tg = ctx.createLinearGradient(0, -fs * 0.52, 0, fs * 0.52);
    tg.addColorStop(0, 'rgba(255,252,238,' + a + ')');
    tg.addColorStop(0.5, 'rgba(255,226,172,' + a + ')');
    tg.addColorStop(1, 'rgba(238,176,102,' + a + ')');
    ctx.shadowColor = 'rgba(255,198,124,' + (0.65 * a) + ')';
    ctx.shadowBlur = fs * 0.26;
    ctx.fillStyle = tg;
    ctx.fillText(String(num), 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ---------- 文字阶段 ----------
  var motes = [];

  function buildMotes() {
    motes = [];
    var n = Math.round(clamp(W * H / 46000, 14, 40));
    for (var i = 0; i < n; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(1.4, 4.2),
        v: rand(3, 14),
        ph: rand(0, TAU),
        a: rand(0.10, 0.34)
      });
    }
  }

  function drawMotes(dt, now) {
    if (!motes.length) return;
    var f = Math.min(dt / 16.667, 3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.y -= m.v * f * 0.6;
      m.x += Math.sin(now * 0.0006 + m.ph) * 5 * f;
      if (m.y < -14) { m.y = H + 14; m.x = rand(0, W); }
      var tw = 0.55 + 0.45 * Math.sin(now * 0.0011 + m.ph);
      ctx.globalAlpha = m.a * tw;
      ctx.drawImage(SPRITE_GOLD, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    }
    ctx.restore();
  }

  function drawTextBackdrop(now, dt) {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    var breathe = 0.62 + 0.38 * Math.sin(now * 0.00042);
    ctx.save();
    ctx.globalAlpha = breathe;
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.55 + 0.45 * Math.sin(now * 0.001 * s.sp + s.p);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fillStyle = 'rgba(226,236,255,' + (s.a * tw) + ')';
      ctx.fill();
    }
    ctx.restore();

    var f = Math.min(dt / 16.667, 3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < bokeh.length; j++) {
      var b = bokeh[j];
      b.x += b.vx * f;
      b.y += b.vy * f;
      if (b.x < -b.r) b.x = W + b.r;
      if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      if (b.y > H + b.r) b.y = -b.r;
      ctx.globalAlpha = b.a;
      ctx.drawImage(b.cold ? SPRITE_WHITE : SPRITE_GOLD, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.restore();
  }

  // ---------- 尺寸 ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    bgGrad = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    bgGrad.addColorStop(0, '#170b24');
    bgGrad.addColorStop(0.42, '#0b0614');
    bgGrad.addColorStop(1, '#030207');

    glowGrad = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.42);
    glowGrad.addColorStop(0, 'rgba(255,210,140,.13)');
    glowGrad.addColorStop(0.45, 'rgba(196,140,222,.05)');
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');

    vigGrad = ctx.createRadialGradient(W / 2, H * 0.47, Math.min(W, H) * 0.18, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(0.62, 'rgba(0,0,0,0.16)');
    vigGrad.addColorStop(1, 'rgba(0,0,0,0.58)');

    buildStars();
    buildBokeh();
    buildMotes();
    SC = null;
    buildScene();
    wordsCache = null;
    glowCache = {};
    buildParticles();

    // 已经成形的字不要因为缩放散掉
    if (burstDone) {
      for (var pi = 0; pi < particles.length; pi++) {
        var pp = particles[pi];
        pp.x = pp.tx; pp.y = pp.ty;
        pp.vx = 0; pp.vy = 0; pp.alpha = 1;
      }
    }
  }

  // ---------- 主循环 ----------
  function frame(now) {
    if (Math.abs(window.innerWidth - W) > 0.5 || Math.abs(window.innerHeight - H) > 0.5) resize();
    var dt = last ? Math.min(now - last, 50) : 16.667;
    last = now;
    clockMs += dt;
    if (FREEZE_AT > 0) clockMs = FREEZE_AT;
    var el = clockMs;
    var dtf = Math.min(dt / 16.667, 3);

    var sceneIn = smooth(sceneAt - 1500, sceneAt + 500, el);
    var textOut = 1 - smooth(sceneAt - 1700, sceneAt - 200, el);

    if (!burstDone && el > T_BURST) {
      burstDone = true;
      doBurst();
      applyWord(wordIdx);
      lastWordSwap = clockMs;
      fireBarrage();
      spawnConfetti(W < 760 ? 46 : 80, true);
      setTimeout(function () { document.getElementById('sub').classList.add('on'); }, 2400);
      setTimeout(function () { document.getElementById('hint').classList.add('on'); }, 4600);
    }

    if (el > sceneAt - 1600) {
      var subEl = document.getElementById('sub');
      if (subEl.classList.contains('on')) subEl.classList.remove('on');
    }

    /* ---------- 文字阶段 ---------- */
    if (sceneIn < 0.999) {
      drawTextBackdrop(now, dt);
      drawNebula(now);

      // 右上角的小灯
      var chH = W < 780 ? Math.min(H * 0.21, W * 0.52) : Math.min(H * 0.29, W * 0.23);
      var chX = W < 780 ? W * 0.83 : W * 0.805;
      var chBase = (W < 780 ? H * 0.115 : H * 0.055) + chH;
      drawLantern(chX, chBase, chH, now, dtf);

      if (!burstDone) {
        var prog = clamp((el - T_COUNT) / Math.max(1, T_BURST - T_COUNT), 0, 1);
        var pulse = 0.35 + 0.65 * Math.pow(Math.sin(el * 0.0016), 2);
        var oy = H * 0.53;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var gs = 22 + prog * 70 + pulse * 20;
        ctx.globalAlpha = 0.38 + pulse * 0.36;
        ctx.drawImage(SPRITE_GOLD, W / 2 - gs / 2, oy - gs / 2, gs, gs);
        var gs2 = 6 + prog * 10 + pulse * 4;
        ctx.globalAlpha = 0.85;
        ctx.drawImage(SPRITE_WHITE, W / 2 - gs2 / 2, oy - gs2 / 2, gs2, gs2);
        ctx.restore();
      } else {
        var pull = clamp((el - T_BURST - 550) / 2400, 0, 1);
        var eased = pull * pull * (3 - 2 * pull);

        var steps = Math.min(3, Math.max(1, Math.ceil(dt / 16.667)));
        var sf = dt / steps / 16.667;

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          for (var st = 0; st < steps; st++) {
            if (eased > 0) {
              p.vx += (p.tx - p.x) * 0.019 * eased * sf;
              p.vy += (p.ty - p.y) * 0.019 * eased * sf;
            }
            if (mouse.inside) {
              var dx = p.x - mouse.x, dy = p.y - mouse.y;
              var d2 = dx * dx + dy * dy;
              if (d2 < 20000) {
                var d = Math.sqrt(d2) || 1;
                var force = (1 - d / 141) * 7.5;
                p.vx += dx / d * force * sf;
                p.vy += dy / d * force * sf;
              }
            }
            var damp = Math.pow(0.918, sf);
            p.vx *= damp;
            p.vy *= damp;
            p.x += p.vx * sf;
            p.y += p.vy * sf;
          }
          if (p.alpha < 1) p.alpha = Math.min(1, p.alpha + 0.014 * dtf);
          p.phase += 0.02 * p.flick * dtf;
        }

        var ga = clamp((el - wordAt - 1100) / 1600, 0, 1);
        ga = ga * ga * (3 - 2 * ga);
        drawTextGlow(currentWord, ga * textOut);

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var j = 0; j < particles.length; j++) {
          var q = particles[j];
          var shimmer = 0.88 + 0.12 * Math.sin(q.phase);
          var sz = q.size * shimmer;
          ctx.globalAlpha = q.alpha * shimmer * 0.9 * textOut;
          var sp2 = q.white ? SPRITE_WHITE : SPRITE_GOLD;
          ctx.drawImage(sp2, q.x - sz / 2, q.y - sz / 2, sz, sz);
        }
        ctx.restore();

        var words = getWords();
        if (!NO_SWAP && sceneIn < 0.001 && words.length > 1 && clockMs - lastWordSwap > WORD_HOLD) {
          lastWordSwap = clockMs;
          applyWord(wordIdx + 1);
        }
      }

      drawMotes(dt, now);
    }

    /* ---------- 暖场画面 ---------- */
    if (sceneIn > 0.001) {
      updateCandles(dt);
      if (!blowShown && sceneIn > 0.55) {
        blowShown = true;
        showBlowUI();
        var hintEl = document.getElementById('hint');
        if (hintEl) hintEl.classList.remove('on');
      }
      drawScene(now, dt, dtf);

      if (sceneIn > 0.85 && confetti.length < 80 && Math.random() < 0.06) {
        spawnConfetti(3, true);
      }

      if (sceneIn < 0.999) {
        ctx.save();
        ctx.globalAlpha = 1 - sceneIn;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    if (!SIM_HOLD) updateFireworks(dt);
    drawFireworks(1);

    if (sceneIn > 0.02) {
      if (!SIM_HOLD) updateConfetti(dt);
      drawConfetti(sceneIn);
    }

    if (vigGrad) {
      ctx.save();
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    drawCountdown(el);

    requestAnimationFrame(frame);
  }

  // ---------- 交互 ----------
  function onPointerDown(e) {
    var x, y;
    if (e.touches && e.touches.length) {
      x = e.touches[0].clientX; y = e.touches[0].clientY;
    } else {
      x = e.clientX; y = e.clientY;
    }
    mouse.x = x; mouse.y = y; mouse.inside = true;

    // 点在蜡烛上 → 吹灭它，而不是放烟花
    if (clockMs > sceneAt - 400 && !cdl.allOut && hitCandle(x, y) !== -1) {
      startBlow();
      return;
    }

    queueShell(0, x, Math.min(y, H * 0.62), true);
    if (confetti.length < 110) spawnConfetti(6, false);
  }

  function onPointerMove(e) {
    var x, y;
    if (e.touches && e.touches.length) {
      x = e.touches[0].clientX; y = e.touches[0].clientY;
    } else {
      x = e.clientX; y = e.clientY;
    }
    mouse.x = x; mouse.y = y; mouse.inside = true;

    // 快速划过蜡烛 = 扇风
    var tNow = (window.performance && performance.now) ? performance.now() : Date.now();
    if (ptrPrev && clockMs > sceneAt - 500 && !cdl.allOut) {
      var ddx = x - ptrPrev.x, ddy = y - ptrPrev.y;
      var dtt = Math.max(8, tNow - ptrPrev.t);
      if (dtt > 3) {
        var sp = Math.sqrt(ddx * ddx + ddy * ddy) / dtt;
        if (sp > 1.3) {
          var c1 = candleWorld(1);
          if (c1) {
            var nearX = Math.abs(x - c1.x) < W * 0.26;
            var nearY = Math.abs(y - c1.y) < H * 0.20;
            if (nearX && nearY) {
              blowWind(Math.min(0.42, sp * 0.13), ddx >= 0 ? 1 : -1);
              if (sp > 2.3) startBlow();
            }
          }
        }
      }
    }
    ptrPrev = { x: x, y: y, t: tNow };
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerleave', function () { mouse.inside = false; });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    onPointerDown(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    onPointerMove(e);
  }, { passive: false });
  canvas.addEventListener('touchend', function () { mouse.inside = false; });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 200);
  });

  // ---------- 启动 ----------
  function fastForward() {
    clockMs = T_BURST + 4200;
    burstDone = true;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x = p.tx; p.y = p.ty;
      p.vx = 0; p.vy = 0; p.alpha = 1;
    }
    document.getElementById('sub').classList.add('on');
    document.getElementById('hint').classList.add('on');
    lastWordSwap = clockMs;
  }

  function boot() {
    initSprites();
    initNebula();
    buildLantern();
    initBlowUI();
    resize();

    if (SCENE_NOW) {
      clockMs = sceneAt + 6000;
      burstDone = true;
      spawnConfetti(W < 760 ? 40 : 66, true);
      for (var i = 0; i < particles.length; i++) { particles[i].alpha = 0; }
      // 调试：?blow=1 自动吹灭（可配 &sim2=毫秒 同步推进）
      if (QS.get('blow')) {
        startBlow();
        var bs = parseFloat(QS.get('sim2')) || 0;
        if (bs > 0) {
          var bsteps = Math.round(bs / 16.7);
          for (var bi3 = 0; bi3 < bsteps; bi3++) {
            clockMs += 16.7;
            updateCandles(16.7);
            updateFireworks(16.7);
            updateConfetti(16.7);
          }
          FREEZE_AT = clockMs;
          SIM_HOLD = true;
        }
      }
    } else if (SIM_MS > 0) {
      // 调试：把开场爆发瞬间快进出来
      clockMs = T_BURST;
      burstDone = true;
      for (var si2 = 0; si2 < particles.length; si2++) {
        var ps = particles[si2];
        ps.x = ps.tx; ps.y = ps.ty; ps.vx = 0; ps.vy = 0; ps.alpha = 1;
      }
      lastWordSwap = clockMs;
      fireBarrage();
      spawnConfetti(W < 760 ? 50 : 84, true);
      var steps2 = Math.round(SIM_MS / 16.7);
      for (var s3 = 0; s3 < steps2; s3++) {
        clockMs += 16.7;
        updateFireworks(16.7);
        updateConfetti(16.7);
      }
      FREEZE_AT = clockMs;
      SIM_HOLD = true;
    } else if (SKIP_MS > 0) {
      fastForward();
      if (SKIP_MS > 1) clockMs = SKIP_MS;
    }

    requestAnimationFrame(frame);
  }

  boot();
})();
</script>
</body>
</html>
