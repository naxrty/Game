<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Birthday</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#05030a;
    -webkit-font-smoothing:antialiased;
  }
  body {
    font-family:-apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage { position:fixed; inset:0; display:block; }

  .sub {
    position:fixed; left:50%; bottom:24%; transform:translateX(-50%);
    text-align:center; pointer-events:none;
    opacity:0; transition:opacity 2.2s cubic-bezier(.2,.8,.3,1);
  }
  .sub.on { opacity:1; }
  .rule {
    width:70px; height:1px; margin:0 auto 22px;
    background:linear-gradient(90deg, rgba(201,165,88,0), #e8c37a, rgba(201,165,88,0));
    transform:scaleX(0); transition:transform 1.8s cubic-bezier(.2,.8,.3,1) .4s;
  }
  .sub.on .rule { transform:scaleX(1); }
  .cn {
    font-size:16px; letter-spacing:8px; color:#fdf4de; font-weight:400;
    text-indent:8px;
    text-shadow:0 0 22px rgba(255,212,144,.7), 0 0 62px rgba(255,172,82,.34);
  }
  .en {
    margin-top:14px; font-size:10px; letter-spacing:5px;
    color:#d3bc90; text-transform:lowercase; font-weight:300;
  }

  .hint {
    position:fixed; left:50%; bottom:9%; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:4.5px; color:#b39c74;
    opacity:0; transition:opacity 2s ease; pointer-events:none;
    white-space:nowrap; text-indent:4.5px;
  }
  .hint.on { opacity:.85; }

  /* 吹蜡烛提示 */
  .blow {
    position:fixed; left:50%; bottom:4.2%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:13px;
    opacity:0; transition:opacity 1.3s cubic-bezier(.2,.8,.3,1);
    pointer-events:none; z-index:5;
  }
  .blow.on { opacity:1; }
  .blowbtn {
    pointer-events:auto; cursor:pointer; font-family:inherit;
    font-size:12px; letter-spacing:2px; color:#2b1708;
    padding:11px 26px; border:0; border-radius:999px;
    background:linear-gradient(180deg,#fff0cd,#e8c37a 52%,#c1934a);
    box-shadow:0 7px 26px rgba(232,195,122,.36),
               inset 0 1px 0 rgba(255,255,255,.75),
               inset 0 -2px 6px rgba(120,80,30,.22);
    transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s ease;
  }
  .blowbtn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(232,195,122,.5), inset 0 1px 0 rgba(255,255,255,.8); }
  .blowbtn:active { transform:translateY(0) scale(.975); }
  .blowtxt {
    font-size:10px; letter-spacing:3.2px; color:#e9d2a4; text-indent:3.2px;
    text-shadow:0 0 20px rgba(255,198,116,.55);
    white-space:nowrap; transition:opacity .6s ease;
  }
  .blowtxt.dim { opacity:.55; }
  .blowtxt.big {
    font-size: 11.5px; letter-spacing: 1.4px; text-indent: 1.4px;
    color: #f6e2bb; opacity: .92;
  }

  /* 声音开关 */
  .mute {
    position:fixed; top:16px; right:16px; z-index:9;
    width:38px; height:38px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(30,21,36,.62); border:1px solid rgba(226,190,130,.34);
    border-radius:50%; cursor:pointer; color:#e2c795;
    opacity:.62; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 3px 14px rgba(0,0,0,.28);
    transition:opacity .5s ease, border-color .5s ease, color .5s ease, transform .2s ease;
  }
  .mute:hover { opacity:1; border-color:rgba(240,206,146,.7); color:#fbe9c2; }
  .mute:active { transform:scale(.92); }
  .mute .x { opacity:0; transition:opacity .3s ease; }
  .mute .w1, .mute .w2 { opacity:1; transition:opacity .3s ease; }
  .mute.off { opacity:.40; color:#8d7a5d; }
  .mute.off .x { opacity:1; }
  .mute.off .w1, .mute.off .w2 { opacity:0; }
  .mute.nudge { animation:nudge 1.6s ease 2; }
  @keyframes nudge {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-3px); }
    40% { transform:translateX(3px); }
    60% { transform:translateX(-2px); }
  }

  @media (max-width: 680px) {
    .mute { width:34px; height:34px; top:13px; right:13px; }
    .sub { bottom: 21%; }
    .rule { width: 48px; margin-bottom: 18px; }
    .cn { font-size: 13px; letter-spacing: 4px; text-indent: 4px; white-space: nowrap; }
    .en { font-size: 8px; letter-spacing: 2.5px; margin-top: 12px; white-space: nowrap; }
    .hint { font-size: 8px; letter-spacing: 2.5px; bottom: 11%; }
    .blow { bottom: 5.2%; gap: 9px; }
    .blowbtn { font-size: 11px; letter-spacing: 1.4px; padding: 10px 19px; }
    .blowtxt { font-size: 8.5px; letter-spacing: 1.6px; text-indent: 1.6px; }
  }

  /* ---------- 开场遮罩 ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(62% 58% at 50% 44%, #1d0f28 0%, #0a0512 64%, #030106 100%);
    transition: opacity 1.15s cubic-bezier(.4,0,.2,1);
    cursor: pointer;
  }
  #gate.out { opacity: 0; pointer-events: none; }
  #gate .g0 {
    font-size: 9px; letter-spacing: 5.5px; color: #a9906a; text-indent: 5.5px;
    opacity: 0; animation: gUp 1.5s .25s forwards;
  }
  #gate .g2 {
    margin-top: 22px; font-size: 60px; font-weight: 200; letter-spacing: 4px;
    color: #fbeccb; line-height: 1;
    text-shadow: 0 0 34px rgba(255,198,116,.5), 0 0 88px rgba(255,160,60,.28);
    opacity: 0; animation: gUp 1.9s .6s forwards;
  }
  #gate .g1 {
    margin-top: 18px; font-size: 11px; letter-spacing: 7px; color: #e8d3ac;
    text-indent: 7px; opacity: 0; animation: gUp 1.9s 1.0s forwards;
  }
  #gate .g3 {
    position: absolute; bottom: 12%;
    font-size: 10px; letter-spacing: 4.5px; color: #9c8560; text-indent: 4.5px;
    opacity: 0; animation: gPulse 2.6s 1.9s infinite;
  }
  @keyframes gUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes gPulse { 0%,100% { opacity: .3; } 50% { opacity: .92; } }

  /* ---------- 结尾祝福 ---------- */
  .wish {
    position: fixed; left: 50%; top: 25.5%; transform: translate(-50%, -6px);
    text-align: center; pointer-events: none; z-index: 6;
    opacity: 0; transition: opacity 1.5s cubic-bezier(.2,.8,.3,1), transform 1.5s cubic-bezier(.2,.8,.3,1);
  }
  .wish.on { opacity: 1; transform: translate(-50%, 0); }
  .wish .rule { margin-bottom: 16px; }
  .wish .cn {
    font-size: 19px; letter-spacing: 5px; text-indent: 5px; font-weight: 500;
    text-shadow: 0 0 18px rgba(255,196,120,.55), 0 0 42px rgba(255,150,90,.28), 0 1px 2px rgba(0,0,0,.5);
  }
  .wish .en { margin-top: 11px; font-size: 9px; letter-spacing: 4px; }

  /* ---------- 跳过 / 再看一遍 ---------- */
  #skip, #replay {
    position: fixed; left: 50%; transform: translateX(-50%);
    font-family: inherit; cursor: pointer; z-index: 12;
    background: rgba(28,20,34,.55); color: #d9c39a;
    border: 1px solid rgba(226,190,130,.28); border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity .8s ease, border-color .3s ease, color .3s ease;
  }
  #skip { bottom: 6%; font-size: 9px; letter-spacing: 3.5px; padding: 7px 18px; text-indent: 3.5px; }
  #replay { bottom: 8%; font-size: 11px; letter-spacing: 3px; padding: 11px 26px; text-indent: 3px; }
  #skip.on, #replay.on { opacity: .8; pointer-events: auto; }
  #skip:hover, #replay:hover { opacity: 1; border-color: rgba(240,206,146,.72); color: #fbe9c2; }
  #skip:active, #replay:active { transform: translateX(-50%) scale(.95); }

  /* ---------- 署名 ---------- */
  #credit {
    position: fixed; left: 0; right: 0; bottom: 8px; z-index: 5;
    text-align: center; font-size: 7.5px; letter-spacing: 1.2px;
    color: #6d5c46; pointer-events: none;
    opacity: 0; transition: opacity 2s ease;
  }
  #credit.on { opacity: .55; }

  @media (max-width: 680px) {
    #gate .g2 { font-size: 46px; }
    #gate .g1 { font-size: 9.5px; letter-spacing: 5px; text-indent: 5px; }
    .wish { top: 25%; }
    .wish .cn { font-size: 16px; letter-spacing: 3.5px; text-indent: 3.5px; }
    .wish .en { font-size: 8px; letter-spacing: 3px; }
  }
  /* 宽屏：灯牌更高，祝福语要往下让开，否则会和「生日快乐」贴在一起 */
  @media (min-width: 681px) {
    .wish { top: 33%; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="gate">
  <div class="g0">A LITTLE GIFT</div>
  <div class="g2" id="gateage">20</div>
  <div class="g1" id="gatetxt">生日快乐</div>
  <div class="g3">轻触屏幕 · 点亮它</div>
</div>

<div class="wish" id="wish">
  <div class="rule"></div>
  <div class="cn" id="wishcn">生日快乐</div>
  <div class="en" id="wishfrom"></div>
</div>

<button id="skip">跳过</button>
<button id="replay">再看一遍</button>
<div id="credit">角色形象 · 鲸鱼娘（社区二创）｜素材 TreapGoGo/deepseek-whale-girl · MIT</div>

<button class="mute" id="mute" aria-label="声音开关">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
       stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 9.4h3.1L12 5.7v12.6L7.3 14.6H4.2z"/>
    <path class="w1" d="M15.1 9.1a4.1 4.1 0 0 1 0 5.8"/>
    <path class="w2" d="M17.7 6.6a7.5 7.5 0 0 1 0 10.8"/>
    <path class="x" d="M15.4 9.6l5 4.8M20.4 9.6l-5 4.8"/>
  </svg>
</button>

<div class="sub" id="sub">
  <div class="rule"></div>
  <div class="cn">愿这一年对你温柔一点</div>
  <div class="en">may this year be gentle with you</div>
</div>

<div class="hint" id="hint">点击任意处 · 放一朵烟花</div>

<div class="blow" id="blow">
  <button class="blowbtn" id="blowbtn">点一下 · 允许麦克风</button>
  <div class="blowtxt" id="blowtxt"></div>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================
     想加名字就改这一行。
     填上以后，粒子会在「HAPPY BIRTHDAY」「生日快乐」「名字」之间轮播。
     例： var NAME = '小林';
     ========================================================== */
  var NAME = '';

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  var bgGrad = null, glowGrad = null, vigGrad = null, warmVig = null;

  var clockMs = 0, last = 0;
  var burstDone = false;

  // 开场节奏
  var T_COUNT = 700;
  var T_STEP = 1050;
  var T_BURST = T_COUNT + T_STEP * 3 + 240;
  var T_TEXT = T_BURST + 760;
  var WORD_HOLD = 2600;
  var sceneAt = 1e9;

  var mouse = { x: -9999, y: -9999, inside: false };
  var ptrPrev = null;

  // 调试参数
  var QS = new URLSearchParams(location.search);
  var SKIP_MS = parseFloat(QS.get('t')) || 0;
  var SCENE_NOW = QS.get('scene') === '1';
  var START_WORD = parseInt(QS.get('w'), 10) || 0;
  var NO_SWAP = QS.get('noswap') === '1';
  var FREEZE_AT = parseFloat(QS.get('freeze')) || 0;
  var SIM_MS = parseFloat(QS.get('sim')) || 0;

  var TAU = Math.PI * 2;
  var SIM_HOLD = false;
  var SPRITE_GOLD = null, SPRITE_WHITE = null, SPRITE_SOFT = null, SPRITE_PINK = null;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  // ---------- 光点精灵 ----------
  function makeGlow(cIn, cMid, cOut, size) {
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    var x = c.getContext('2d');
    var r = size / 2;
    var g = x.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, cIn);
    g.addColorStop(0.22, cMid);
    g.addColorStop(1, cOut);
    x.fillStyle = g;
    x.beginPath();
    x.arc(r, r, r, 0, TAU);
    x.fill();
    return c;
  }

  function initSprites() {
    SPRITE_GOLD = makeGlow('rgba(255,255,250,1)', 'rgba(255,226,158,.86)', 'rgba(255,182,72,0)', 64);
    SPRITE_WHITE = makeGlow('rgba(255,255,255,1)', 'rgba(222,238,255,.66)', 'rgba(176,206,255,0)', 64);
    SPRITE_SOFT = makeGlow('rgba(255,244,220,1)', 'rgba(255,206,140,.42)', 'rgba(255,170,80,0)', 256);
    SPRITE_PINK = makeGlow('rgba(255,255,255,1)', 'rgba(255,190,220,.70)', 'rgba(255,110,180,0)', 64);
  }

  // ---------- 夜空的星尘 / 星云 / 散景 ----------
  var stars = [], bokeh = [], NEB = [];

  function buildStars() {
    stars = [];
    var n = Math.min(230, Math.round(W * H / 7200));
    for (var i = 0; i < n; i++) {
      stars.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(0.35, 1.5),
        p: rand(0, TAU),
        sp: rand(0.2, 0.9),
        a: rand(0.10, 0.55)
      });
    }
  }

  function buildBokeh() {
    bokeh = [];
    for (var i = 0; i < 8; i++) {
      bokeh.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(90, 300),
        vx: rand(-7, 7), vy: rand(-5, 5),
        a: rand(0.022, 0.06),
        cold: Math.random() < 0.28
      });
    }
  }

  function makeNeb(r, g, b) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var x = c.getContext('2d');
    var gd = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    gd.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',.5)');
    gd.addColorStop(0.38, 'rgba(' + r + ',' + g + ',' + b + ',.17)');
    gd.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
    x.fillStyle = gd;
    x.fillRect(0, 0, 256, 256);
    return c;
  }

  function initNebula() {
    NEB = [
      { img: makeNeb(96, 74, 214), x: 0.20, y: 0.24, r: 0.62, a: 0.105, sp: 0.000011, ph: 0.0 },
      { img: makeNeb(38, 150, 168), x: 0.82, y: 0.34, r: 0.52, a: 0.075, sp: 0.000014, ph: 2.1 },
      { img: makeNeb(214, 84, 150), x: 0.58, y: 0.88, r: 0.58, a: 0.055, sp: 0.000009, ph: 4.3 },
      { img: makeNeb(52, 96, 200), x: 0.40, y: 0.06, r: 0.46, a: 0.065, sp: 0.000016, ph: 1.2 }
    ];
  }

  function drawNebula(now) {
    var md = Math.max(W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < NEB.length; i++) {
      var nb = NEB[i];
      var rad = md * nb.r;
      var x = nb.x * W + Math.sin(now * nb.sp + nb.ph) * W * 0.05;
      var y = nb.y * H + Math.cos(now * nb.sp * 0.8 + nb.ph) * H * 0.04;
      ctx.globalAlpha = nb.a * (0.78 + 0.22 * Math.sin(now * 0.00024 + nb.ph));
      ctx.drawImage(nb.img, x - rad, y - rad, rad * 2, rad * 2);
    }
    ctx.restore();
  }

  // ==========================================================
  //  复古铜质水晶球灯（照着参考图画的）
  //  精灵坐标系：440 x 660，球心 (220,330)，半径 132
  // ==========================================================
  var LANT = { back: null, front: null, done: false };
  var SNOW = [];

  function brassH(c, x0, x1) {
    var g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#5c3d16');
    g.addColorStop(0.14, '#9a6c2c');
    g.addColorStop(0.36, '#e6c88a');
    g.addColorStop(0.5, '#fbeec4');
    g.addColorStop(0.66, '#d3a65c');
    g.addColorStop(0.86, '#8a5f24');
    g.addColorStop(1, '#4a3011');
    return g;
  }

  function brassV(c, y0, y1) {
    var g = c.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, '#f4dda8');
    g.addColorStop(0.35, '#c99a4e');
    g.addColorStop(0.72, '#8a5f24');
    g.addColorStop(1, '#4f3413');
    return g;
  }

  function buildLantern() {
    var w = 440, h = 660, cx = 220, R = 132, gcy = 330, S = 2;
    var back = document.createElement('canvas');
    back.width = w * S; back.height = h * S;
    var b = back.getContext('2d');
    b.scale(S, S);

    var front = document.createElement('canvas');
    front.width = w * S; front.height = h * S;
    var f = front.getContext('2d');
    f.scale(S, S);

    // ---------- back：球体内部 ----------
    var ig = b.createRadialGradient(cx - 34, gcy - 40, 6, cx, gcy, R * 1.06);
    ig.addColorStop(0, 'rgba(255,252,240,0.97)');
    ig.addColorStop(0.30, 'rgba(255,236,196,0.90)');
    ig.addColorStop(0.62, 'rgba(250,208,142,0.74)');
    ig.addColorStop(0.88, 'rgba(224,164,94,0.58)');
    ig.addColorStop(1, 'rgba(186,124,58,0.50)');
    b.beginPath();
    b.arc(cx, gcy, R, 0, TAU);
    b.fillStyle = ig;
    b.fill();

    // 球内小景：雪地
    b.save();
    b.beginPath();
    b.arc(cx, gcy, R - 1, 0, TAU);
    b.clip();

    var mg = b.createLinearGradient(0, gcy + 40, 0, gcy + R);
    mg.addColorStop(0, 'rgba(255,252,240,0.55)');
    mg.addColorStop(1, 'rgba(255,244,214,0.92)');
    b.fillStyle = mg;
    b.beginPath();
    b.ellipse(cx, gcy + 104, R * 1.1, 76, 0, 0, TAU);
    b.fill();

    // 小杉树
    b.fillStyle = 'rgba(146,100,52,0.50)';
    for (var ti = 0; ti < 3; ti++) {
      var ty = gcy + 40 + ti * 24;
      var tw = 22 - ti * 3;
      b.beginPath();
      b.moveTo(cx - 66, ty);
      b.lineTo(cx - 66 + tw, ty - 32);
      b.lineTo(cx - 66 + tw * 2, ty);
      b.closePath();
      b.fill();
    }
    b.fillRect(cx - 64, gcy + 88, 4, 12);

    // 雪人
    b.fillStyle = 'rgba(255,255,255,0.95)';
    b.beginPath(); b.arc(cx + 50, gcy + 86, 14, 0, TAU); b.fill();
    b.beginPath(); b.arc(cx + 50, gcy + 62, 10, 0, TAU); b.fill();
    b.fillStyle = 'rgba(150,100,50,0.55)';
    b.beginPath(); b.moveTo(cx + 50, gcy + 60); b.lineTo(cx + 62, gcy + 64); b.lineTo(cx + 50, gcy + 67); b.closePath(); b.fill();
    b.fillRect(cx + 37, gcy + 51, 22, 3.4);
    b.fillStyle = 'rgba(120,80,40,0.5)';
    b.beginPath(); b.arc(cx + 47, gcy + 60, 1.4, 0, TAU); b.fill();
    b.beginPath(); b.arc(cx + 53, gcy + 60, 1.4, 0, TAU); b.fill();

    // 玻璃厚度暗边
    var rim = b.createRadialGradient(cx, gcy, R * 0.72, cx, gcy, R);
    rim.addColorStop(0, 'rgba(120,70,20,0)');
    rim.addColorStop(1, 'rgba(120,70,20,0.34)');
    b.fillStyle = rim;
