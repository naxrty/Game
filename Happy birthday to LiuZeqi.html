        e.preventDefault();
        requestMic();
      });
    }
    if (blowEl) {
      blowEl.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    }
  }

  function micFallback(msg) {
    cdl.micOn = false;
    if (btnEl) btnEl.style.display = 'none';
    setTip(msg || '换个方式：在蜡烛上快速划一下，或点一下蜡烛');
    showBlowUI();
  }

  function requestMic() {
    if (cdl.micOn) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micFallback('这个浏览器不给用麦克风 · 在蜡烛上快速划一下，或点一下蜡烛');
      return;
    }
    setTip('正在请求麦克风…');

    // 音频上下文要在用户手势里创建，Safari 才不会锁住
    var ac = audEnsureCtx();
    if (!ac) { micFallback(); return; }
    cdl.ac = ac;
    if (ac.state === 'suspended' && ac.resume) {
      try { ac.resume(); } catch (e2) {}
    }
    AUD.unlocked = true;

    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    }).then(function (stream) {
      var src = ac.createMediaStreamSource(stream);
      var an = ac.createAnalyser();
      an.fftSize = 1024;
      an.smoothingTimeConstant = 0.35;
      src.connect(an);
      cdl.analyser = an;
      cdl.sr = ac.sampleRate || 44100;
      cdl.data = new Uint8Array(an.frequencyBinCount);
      cdl.base = 10;
      cdl.micOn = true;
      if (btnEl) btnEl.style.display = 'none';
      setTip('对着屏幕吹一口气 · 或者点一下蜡烛');
      showBlowUI();
    }).catch(function (err) {
      micFallback('麦克风没打开 · 在蜡烛上快速划一下，或点一下蜡烛');
    });
  }

  function drawProp(p, x, base, s) {
    ctx.drawImage(p.img, x - p.w * s / 2, base - p.h * s, p.w * s, p.h * s);
  }

  // ---------- 3-2-1 倒计时 ----------
  function drawCountdown(el) {
    if (el < T_COUNT || el >= T_BURST + 30) return;
    var idx = Math.floor((el - T_COUNT) / T_STEP);
    if (idx > 2) idx = 2;
    var p = clamp((el - T_COUNT - idx * T_STEP) / T_STEP, 0, 1);
    var num = 3 - idx;

    if (AUD.countShown !== num) {
      AUD.countShown = num;
      sfxTick(num === 1);
    }

    var a = p < 0.14 ? p / 0.14 : (p > 0.76 ? Math.max(0, 1 - (p - 0.76) / 0.24) : 1);
    var sc = 1.34 - 0.34 * Math.min(1, p / 0.30);
    var fs = Math.min(H * 0.22, W * 0.26);
    var cxc = W / 2, cyc = H * 0.405;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(cxc, cyc);
    ctx.scale(sc, sc);

    ctx.beginPath();
    ctx.arc(0, 0, fs * 0.90, -Math.PI / 2, -Math.PI / 2 + TAU * p);
    ctx.strokeStyle = 'rgba(232,196,132,' + (0.36 * a) + ')';
    ctx.lineWidth = Math.max(1, fs * 0.005);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, fs * 0.90, -Math.PI / 2, -Math.PI / 2 + TAU * p);
    ctx.strokeStyle = 'rgba(255,240,200,' + (0.5 * a) + ')';
    ctx.lineWidth = Math.max(1, fs * 0.012);
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '200 ' + Math.round(fs) + 'px "Helvetica Neue",Arial,sans-serif';
    var tg = ctx.createLinearGradient(0, -fs * 0.52, 0, fs * 0.52);
    tg.addColorStop(0, 'rgba(255,252,238,' + a + ')');
    tg.addColorStop(0.5, 'rgba(255,226,172,' + a + ')');
    tg.addColorStop(1, 'rgba(238,176,102,' + a + ')');
    ctx.shadowColor = 'rgba(255,198,124,' + (0.65 * a) + ')';
    ctx.shadowBlur = fs * 0.26;
    ctx.fillStyle = tg;
    ctx.fillText(String(num), 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // ---------- 文字阶段 ----------
  var motes = [];

  function buildMotes() {
    motes = [];
    var n = Math.round(clamp(W * H / 46000, 14, 40));
    for (var i = 0; i < n; i++) {
      motes.push({
        x: rand(0, W), y: rand(0, H),
        r: rand(1.4, 4.2),
        v: rand(3, 14),
        ph: rand(0, TAU),
        a: rand(0.10, 0.34)
      });
    }
  }

  function drawMotes(dt, now) {
    if (!motes.length) return;
    var f = Math.min(dt / 16.667, 3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.y -= m.v * f * 0.6;
      m.x += Math.sin(now * 0.0006 + m.ph) * 5 * f;
      if (m.y < -14) { m.y = H + 14; m.x = rand(0, W); }
      var tw = 0.55 + 0.45 * Math.sin(now * 0.0011 + m.ph);
      ctx.globalAlpha = m.a * tw;
      ctx.drawImage(SPRITE_GOLD, m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    }
    ctx.restore();
  }

  function drawTextBackdrop(now, dt) {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    var breathe = 0.62 + 0.38 * Math.sin(now * 0.00042);
    ctx.save();
    ctx.globalAlpha = breathe;
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.55 + 0.45 * Math.sin(now * 0.001 * s.sp + s.p);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fillStyle = 'rgba(226,236,255,' + (s.a * tw) + ')';
      ctx.fill();
    }
    ctx.restore();

    var f = Math.min(dt / 16.667, 3);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < bokeh.length; j++) {
      var b = bokeh[j];
      b.x += b.vx * f;
      b.y += b.vy * f;
      if (b.x < -b.r) b.x = W + b.r;
      if (b.x > W + b.r) b.x = -b.r;
      if (b.y < -b.r) b.y = H + b.r;
      if (b.y > H + b.r) b.y = -b.r;
      ctx.globalAlpha = b.a;
      ctx.drawImage(b.cold ? SPRITE_WHITE : SPRITE_GOLD, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.restore();
  }

  // ---------- 尺寸 ----------
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    bgGrad = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    bgGrad.addColorStop(0, '#170b24');
    bgGrad.addColorStop(0.42, '#0b0614');
    bgGrad.addColorStop(1, '#030207');

    glowGrad = ctx.createRadialGradient(W / 2, H * 0.46, 0, W / 2, H * 0.46, Math.max(W, H) * 0.42);
    glowGrad.addColorStop(0, 'rgba(255,210,140,.13)');
    glowGrad.addColorStop(0.45, 'rgba(196,140,222,.05)');
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');

    vigGrad = ctx.createRadialGradient(W / 2, H * 0.47, Math.min(W, H) * 0.18, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
    vigGrad.addColorStop(0.62, 'rgba(0,0,0,0.16)');
    vigGrad.addColorStop(1, 'rgba(0,0,0,0.58)');

    buildStars();
    buildBokeh();
    buildMotes();
    SC = null;
    buildScene();
    wordsCache = null;
    glowCache = {};
    buildParticles();

    // 已经成形的字不要因为缩放散掉
    if (burstDone) {
      for (var pi = 0; pi < particles.length; pi++) {
        var pp = particles[pi];
        pp.x = pp.tx; pp.y = pp.ty;
        pp.vx = 0; pp.vy = 0; pp.alpha = 1;
      }
    }
  }

  // ---------- 主循环 ----------
  function frame(now) {
    if (Math.abs(window.innerWidth - W) > 0.5 || Math.abs(window.innerHeight - H) > 0.5) resize();
    var dt = last ? Math.min(now - last, 50) : 16.667;
    last = now;
    clockMs += dt;
    if (FREEZE_AT > 0) clockMs = FREEZE_AT;
    var el = clockMs;
    var dtf = Math.min(dt / 16.667, 3);

    var sceneIn = smooth(sceneAt - 1500, sceneAt + 500, el);
    var textOut = 1 - smooth(sceneAt - 1700, sceneAt - 200, el);

    // 还没点开场遮罩：只画星空，时间停住
    if (!started) {
      clockMs = 0;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      drawTextBackdrop(now, 16);
      requestAnimationFrame(frame);
      return;
    }

    updateStory(el, dt);
    updateCam(dt);
    applyCam();

    if (!burstDone && el > T_BURST) {
      burstDone = true;
      doBurst();
      applyWord(wordIdx);
      lastWordSwap = clockMs;
      fireBarrage();
      spawnConfetti(W < 760 ? 46 : 80, true);
      setTimeout(function () { document.getElementById('sub').classList.add('on'); }, 2400);
      setTimeout(function () { document.getElementById('hint').classList.add('on'); }, 4600);
    }

    if (el > sceneAt - 1600) {
      var subEl = document.getElementById('sub');
      if (subEl.classList.contains('on')) subEl.classList.remove('on');
    }

    showSkip(burstDone && el > T_BURST + 1200 && el < sceneAt - 500);

    /* ---------- 文字阶段 ---------- */
    if (sceneIn < 0.999) {
      drawTextBackdrop(now, dt);
      drawNebula(now);

      // 右上角的小灯
      var chH = W < 780 ? Math.min(H * 0.21, W * 0.52) : Math.min(H * 0.29, W * 0.23);
      var chX = W < 780 ? W * 0.83 : W * 0.805;
      var chBase = (W < 780 ? H * 0.115 : H * 0.055) + chH;
      drawLantern(chX, chBase, chH, now, dtf);

      if (!burstDone) {
        var prog = clamp((el - T_COUNT) / Math.max(1, T_BURST - T_COUNT), 0, 1);
        var pulse = 0.35 + 0.65 * Math.pow(Math.sin(el * 0.0016), 2);
        var oy = H * 0.53;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var gs = 22 + prog * 70 + pulse * 20;
        ctx.globalAlpha = 0.38 + pulse * 0.36;
        ctx.drawImage(SPRITE_GOLD, W / 2 - gs / 2, oy - gs / 2, gs, gs);
        var gs2 = 6 + prog * 10 + pulse * 4;
        ctx.globalAlpha = 0.85;
        ctx.drawImage(SPRITE_WHITE, W / 2 - gs2 / 2, oy - gs2 / 2, gs2, gs2);
        ctx.restore();
      } else {
        var pull = clamp((el - T_BURST - 550) / 2400, 0, 1);
        var eased = pull * pull * (3 - 2 * pull);

        var steps = Math.min(3, Math.max(1, Math.ceil(dt / 16.667)));
        var sf = dt / steps / 16.667;

        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          for (var st = 0; st < steps; st++) {
            if (eased > 0) {
              p.vx += (p.tx - p.x) * 0.019 * eased * sf;
              p.vy += (p.ty - p.y) * 0.019 * eased * sf;
            }
            if (mouse.inside) {
              var dx = p.x - mouse.x, dy = p.y - mouse.y;
              var d2 = dx * dx + dy * dy;
              if (d2 < 20000) {
                var d = Math.sqrt(d2) || 1;
                var force = (1 - d / 141) * 7.5;
                p.vx += dx / d * force * sf;
                p.vy += dy / d * force * sf;
              }
            }
            var damp = Math.pow(0.918, sf);
            p.vx *= damp;
            p.vy *= damp;
            p.x += p.vx * sf;
            p.y += p.vy * sf;
          }
          if (p.alpha < 1) p.alpha = Math.min(1, p.alpha + 0.014 * dtf);
          p.phase += 0.02 * p.flick * dtf;
        }

        var ga = clamp((el - wordAt - 1100) / 1600, 0, 1);
        ga = ga * ga * (3 - 2 * ga);
        drawTextGlow(currentWord, ga * textOut);

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var j = 0; j < particles.length; j++) {
          var q = particles[j];
          var shimmer = 0.88 + 0.12 * Math.sin(q.phase);
          var sz = q.size * shimmer;
          ctx.globalAlpha = q.alpha * shimmer * 0.9 * textOut;
          var sp2 = q.white ? SPRITE_WHITE : SPRITE_GOLD;
          ctx.drawImage(sp2, q.x - sz / 2, q.y - sz / 2, sz, sz);
        }
        ctx.restore();

        var words = getWords();
        if (!NO_SWAP && sceneIn < 0.001 && words.length > 1 && clockMs - lastWordSwap > WORD_HOLD) {
          lastWordSwap = clockMs;
          applyWord(wordIdx + 1);
        }
      }

      drawMotes(dt, now);
    }

    /* ---------- 暖场画面 ---------- */
    if (sceneIn > 0.001) {
      updateCandles(dt);
      if (!blowShown && sceneIn > 0.55 && ST.free) {
        blowShown = true;
        showBlowUI();
        var hintEl = document.getElementById('hint');
        if (hintEl) hintEl.classList.remove('on');
      }
      drawScene(now, dt, dtf);

      if (sceneIn > 0.85 && confetti.length < 80 && Math.random() < 0.06) {
        spawnConfetti(3, true);
      }

      if (sceneIn < 0.999) {
        ctx.save();
        ctx.globalAlpha = 1 - sceneIn;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    if (!SIM_HOLD) updateFireworks(dt);
    drawFireworks(1);

    if (sceneIn > 0.02) {
      if (!SIM_HOLD) updateConfetti(dt);
      drawConfetti(sceneIn);
    }

    if (vigGrad) {
      ctx.save();
      ctx.fillStyle = vigGrad;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    updateTrail();
    updateCrumb(dt);
    updateWhaleDust(dt);
    drawWhaleDust();
    drawCrumb();
    drawTrail();
    drawChargeRing();

    if (flashA > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,244,226,' + flashA.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    drawCountdown(el);

    requestAnimationFrame(frame);
  }

  var CH = {};
  var charsReady = false;
  var started = false;

  function loadChars() {
    var keys = [];
    for (var k in CHAR_DATA) if (CHAR_DATA.hasOwnProperty(k)) keys.push(k);
    var left = keys.length;
    if (!left) { charsReady = true; return; }
    for (var i = 0; i < keys.length; i++) {
      (function (key) {
        var im = new Image();
        im.onload = function () {
          CH[key] = { img: im, ar: im.width / Math.max(1, im.height) };
          if (--left <= 0) charsReady = true;
        };
        im.onerror = function () { if (--left <= 0) charsReady = true; };
        im.src = CHAR_DATA[key];
      })(keys[i]);
    }
  }

  // 画一个角色：cx 中心、baseY 脚底、hgt 高度
  function drawChar(name, cx, baseY, hgt, o) {
    var c = CH[name];
    if (!c || !c.img || !c.img.width) return null;
    o = o || {};
    var w = hgt * c.ar;
    ctx.save();
    ctx.globalAlpha = (o.alpha == null ? 1 : o.alpha);
    ctx.translate(cx + (o.dx || 0), baseY + (o.dy || 0));
    if (o.tilt) ctx.rotate(o.tilt);
    ctx.scale(o.sx == null ? 1 : o.sx, o.sy == null ? 1 : o.sy);
    ctx.drawImage(c.img, -w / 2, -hgt, w, hgt);
    ctx.restore();
    return { w: w, h: hgt, cx: cx, baseY: baseY };
  }

  // ---------- 相机 ----------
  var cam = { z: 1, sx: 0, sy: 0 };
  var shakeAmt = 0, flashA = 0;

  function applyCam() {
    var z = cam.z;
    ctx.setTransform(DPR * z, 0, 0, DPR * z,
      DPR * (W / 2 * (1 - z) + cam.sx),
      DPR * (H / 2 * (1 - z) + cam.sy));
  }

  function addShake(v) { shakeAmt = Math.max(shakeAmt, v); }

  function updateCam(dt) {
    shakeAmt *= Math.pow(0.90, Math.min(dt / 16.667, 3));
    if (shakeAmt < 0.05) shakeAmt = 0;
    cam.sx = shakeAmt ? rand(-shakeAmt, shakeAmt) : 0;
    cam.sy = shakeAmt ? rand(-shakeAmt, shakeAmt) : 0;
    flashA *= Math.pow(0.86, Math.min(dt / 16.667, 3));
    if (flashA < 0.004) flashA = 0;
  }

  // ---------- 星轨 ----------
  var trail = [];

  function pushTrail(x, y) {
    trail.push({ x: x, y: y, t: clockMs });
    if (trail.length > 70) trail.shift();
  }

  function updateTrail() {
    while (trail.length && clockMs - trail[0].t > 820) trail.shift();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 1; i < trail.length; i++) {
      var a = trail[i - 1], b = trail[i];
      var age = clamp(1 - (clockMs - b.t) / 820, 0, 1);
      var k = i / trail.length;
      var lw = 0.8 + 3.6 * k * age;
      var g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      g.addColorStop(0, 'rgba(255,208,140,' + (0.05 * age * k).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,244,214,' + (0.42 * age * k).toFixed(3) + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- 巨鲸 ----------
  var wDust = [];

  function drawWhale(now, p, alpha) {
    if (alpha <= 0.01) return;
    var s = Math.min(W, H) * 0.92;
    var cx = W * (1.30 - 1.76 * p);
    var cy = H * 0.395 + Math.sin(now * 0.00055) * H * 0.014
      - Math.sin(p * Math.PI) * H * 0.030;
    var k = s / 1000;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);

    // 背后的冷光，把鲸鱼从暗底里托出来
    var glow = ctx.createRadialGradient(0, 0, s * 0.04, 0, 0, s * 0.62);
    glow.addColorStop(0, 'rgba(96,150,255,0.20)');
    glow.addColorStop(0.46, 'rgba(64,110,220,0.10)');
    glow.addColorStop(1, 'rgba(40,70,180,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.62, s * 0.34, 0, 0, TAU);
    ctx.fill();

    ctx.scale(k, k);

    var body = ctx.createLinearGradient(0, -160, 0, 150);
    body.addColorStop(0, 'rgba(86,142,232,0.94)');
    body.addColorStop(0.26, 'rgba(52,96,196,0.94)');
    body.addColorStop(0.62, 'rgba(28,54,132,0.95)');
    body.addColorStop(1, 'rgba(14,28,78,0.96)');

    // 尾鳍
    ctx.beginPath();
    ctx.moveTo(352, -14);
    ctx.bezierCurveTo(420, -86, 494, -112, 546, -104);
    ctx.bezierCurveTo(512, -54, 498, -16, 504, 12);
    ctx.bezierCurveTo(468, 24, 414, 26, 356, 16);
    ctx.closePath();
    ctx.fillStyle = 'rgba(30,58,138,0.95)';
    ctx.fill();

    // 胸鳍
    ctx.beginPath();
    ctx.moveTo(-176, 96);
    ctx.bezierCurveTo(-116, 152, -22, 168, 22, 150);
    ctx.bezierCurveTo(-34, 120, -108, 96, -176, 96);
    ctx.closePath();
    ctx.fillStyle = 'rgba(40,74,158,0.92)';
    ctx.fill();

    // 身体
    ctx.beginPath();
    ctx.moveTo(-458, 8);
    ctx.bezierCurveTo(-420, -92, -156, -152, 118, -120);
    ctx.bezierCurveTo(248, -104, 328, -60, 380, -20);
    ctx.lineTo(380, 18);
    ctx.bezierCurveTo(320, 60, 220, 118, 80, 128);
    ctx.bezierCurveTo(-158, 142, -398, 88, -458, 8);
    ctx.closePath();
    ctx.fillStyle = body;
    ctx.fill();

    // 腹部浅色，拉开体积
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-440, 26);
    ctx.bezierCurveTo(-330, 96, -60, 132, 120, 112);
    ctx.bezierCurveTo(230, 98, 310, 62, 360, 20);
    ctx.lineTo(380, 18);
    ctx.bezierCurveTo(320, 60, 220, 118, 80, 128);
    ctx.bezierCurveTo(-158, 142, -398, 88, -458, 8);
    ctx.closePath();
    var belly = ctx.createLinearGradient(0, 20, 0, 140);
    belly.addColorStop(0, 'rgba(150,190,246,0)');
    belly.addColorStop(0.45, 'rgba(150,190,246,0.20)');
    belly.addColorStop(1, 'rgba(178,212,255,0.30)');
    ctx.fillStyle = belly;
    ctx.fill();
    ctx.restore();

    // 背脊高光
    ctx.beginPath();
    ctx.moveTo(-440, -22);
    ctx.bezierCurveTo(-404, -100, -150, -146, 112, -116);
    ctx.bezierCurveTo(236, -100, 314, -58, 366, -22);
    ctx.strokeStyle = 'rgba(178,216,255,0.62)';
    ctx.lineWidth = 5;
    ctx.stroke();

    // 腹部两道弧
    ctx.strokeStyle = 'rgba(160,198,248,0.16)';
    ctx.lineWidth = 3;
    for (var i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(-300 + i * 40, 96 + i * 22);
      ctx.quadraticCurveTo(-40, 128 + i * 18, 230, 66 + i * 18);
      ctx.stroke();
    }

    // 嘴缝 + 眼睛
    ctx.strokeStyle = 'rgba(190,220,255,0.34)';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(-452, 14);
    ctx.quadraticCurveTo(-360, 44, -250, 40);
    ctx.stroke();
    ctx.fillStyle = 'rgba(232,244,255,0.92)';
    ctx.beginPath();
    ctx.ellipse(-372, 6, 14, 10, -0.18, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(18,30,70,0.9)';
    ctx.beginPath();
    ctx.ellipse(-369, 7, 6, 6.6, -0.18, 0, TAU);
    ctx.fill();

    ctx.restore();

    // 尾鳍甩出的星尘
    if (Math.random() < 0.55 && alpha > 0.4) {
      wDust.push({
        x: cx + s * 0.46, y: cy + rand(-s * 0.12, s * 0.05),
        vx: rand(0.4, 1.8), vy: rand(-0.5, 0.7),
        r: rand(1.2, 3.2), life: 1, decay: rand(0.004, 0.011)
      });
    }
  }

  function updateWhaleDust(dt) {
    var f = Math.min(dt / 16.667, 3);
    for (var i = wDust.length - 1; i >= 0; i--) {
      var p = wDust[i];
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.vy += 0.004 * f;
      p.life -= p.decay * f;
      if (p.life <= 0) wDust.splice(i, 1);
    }
    if (wDust.length > 260) wDust.splice(0, wDust.length - 260);
  }

  function drawWhaleDust() {
    if (!wDust.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < wDust.length; i++) {
      var p = wDust[i];
      var a = Math.max(0, p.life);
      ctx.globalAlpha = a * 0.85;
      ctx.drawImage(SPRITE_GOLD, p.x - p.r * 2.4, p.y - p.r * 2.4, p.r * 4.8, p.r * 4.8);
    }
    ctx.restore();
  }

  // ---------- 主礼盒 ----------
  function drawHeroBox(cx, baseY, bw, lidT, glow, alpha) {
    if (alpha <= 0.01) return;
    var bh = bw * 0.80;
    var x0 = cx - bw / 2, y0 = baseY - bh;

    ctx.save();
    ctx.globalAlpha = alpha;

    // 落影
    var sg = ctx.createRadialGradient(cx, baseY, 2, cx, baseY, bw * 0.66);
    sg.addColorStop(0, 'rgba(0,0,0,0.5)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.ellipse(cx, baseY, bw * 0.66, bw * 0.15, 0, 0, TAU);
    ctx.fill();

    // 盒身
    var bg = ctx.createLinearGradient(x0, 0, x0 + bw, 0);
    bg.addColorStop(0, '#5e1f30');
    bg.addColorStop(0.18, '#a5384f');
    bg.addColorStop(0.44, '#d06a83');
    bg.addColorStop(0.62, '#b34a63');
    bg.addColorStop(1, '#511a29');
    ctx.fillStyle = bg;
    rr(ctx, x0, y0, bw, bh, bw * 0.035);
    ctx.fill();

    // 盒内亮光（开盖后透出）
    if (lidT > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var ig = ctx.createRadialGradient(cx, y0 + bh * 0.1, 2, cx, y0 + bh * 0.1, bw * 0.85);
      ig.addColorStop(0, 'rgba(255,236,190,' + (0.85 * Math.min(1, lidT * 2.2)) + ')');
      ig.addColorStop(0.35, 'rgba(255,186,110,' + (0.4 * Math.min(1, lidT * 2)) + ')');
      ig.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = ig;
      ctx.fillRect(x0 - bw * 0.4, y0 - bh * 0.7, bw * 1.8, bh * 1.9);
      ctx.restore();
    }

    // 竖向缎带
    var rg = ctx.createLinearGradient(0, y0, 0, y0 + bh);
    rg.addColorStop(0, '#fff0c8');
    rg.addColorStop(0.5, '#f0c46c');
    rg.addColorStop(1, '#b8892f');
    ctx.fillStyle = rg;
    ctx.fillRect(cx - bw * 0.062, y0, bw * 0.124, bh);

    // 盒身描边
    ctx.strokeStyle = 'rgba(255,214,150,0.34)';
    ctx.lineWidth = 1.2;
    rr(ctx, x0, y0, bw, bh, bw * 0.035);
    ctx.stroke();

    // 盖子
    if (lidT < 1) {
      var lt = lidT;
      var lh = bh * 0.172;
      var lx = cx + lt * lt * bw * 1.05;
      var ly = y0 - lh * 0.94 - lt * bh * 1.62 + lt * lt * bh * 0.58;
      ctx.save();
      ctx.globalAlpha = alpha * (1 - Math.max(0, (lt - 0.62) / 0.38));
      ctx.translate(lx, ly + lh * 0.5);
      ctx.rotate(lt * 1.15);
      ctx.translate(-lx, -(ly + lh * 0.5));
      var lg = ctx.createLinearGradient(0, ly, 0, ly + lh);
      lg.addColorStop(0, '#ea93a8');
      lg.addColorStop(0.40, '#c05b74');
      lg.addColorStop(1, '#6f2337');
      ctx.fillStyle = lg;
      rr(ctx, x0 - bw * 0.032, ly, bw * 1.064, lh, bw * 0.026);
      ctx.fill();
      // 竖向缎带过盖
      ctx.fillStyle = '#f6cd7f';
      ctx.fillRect(cx - bw * 0.058, ly, bw * 0.116, lh);
      // 蝴蝶结
      var bwid = bw * 0.082, bhgt = lh * 0.40;
      var bx0 = cx, by0 = ly - bhgt * 0.62;
      var bg2 = ctx.createLinearGradient(bx0, by0 - bhgt, bx0, by0 + bhgt);
      bg2.addColorStop(0, '#fff3cd');
      bg2.addColorStop(0.55, '#f5c96f');
      bg2.addColorStop(1, '#c8942f');
      ctx.fillStyle = bg2;
      ctx.beginPath();
      ctx.ellipse(bx0 - bwid * 1.05, by0, bwid, bhgt, -0.30, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bx0 + bwid * 1.05, by0, bwid, bhgt, 0.30, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ffeec0';
      ctx.beginPath();
      ctx.arc(bx0, by0, bwid * 0.48, 0, TAU);
      ctx.fill();
      // 盖底暗线
      ctx.strokeStyle = 'rgba(60,16,30,0.45)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x0 - bw * 0.032, ly + lh - 0.7);
      ctx.lineTo(x0 + bw * 1.032, ly + lh - 0.7);
      ctx.stroke();
      ctx.restore();
    }

    // 呼吸光
    if (glow > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha * glow;
      ctx.drawImage(SPRITE_GOLD, cx - bw * 0.95, baseY - bh * 1.15, bw * 1.9, bw * 1.9);
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------- 蛋糕被咬过的版本 ----------
  function biteVariant(src, deep) {
    var c = document.createElement('canvas');
    c.width = src.img.width;
    c.height = src.img.height;
    var x = c.getContext('2d');
    x.drawImage(src.img, 0, 0);
    var cw = c.width, ch = c.height;

    // 顶层几何（与 renderCake 里 tier() 的参数保持一致）
    var ccx = cw * 0.5;            // 中心
    var chw = cw * 0.252;          // 顶层半宽
    var cry = cw * 0.076;          // 顶面椭圆短轴
    var cty = ch * 0.120;          // 顶面椭圆中心
    var rimY = function (px) {
      var k = clamp((px - ccx) / chw, -1, 1);
      return cty + cry * Math.sqrt(Math.max(0, 1 - k * k));
    };

    // 缺口：贴着顶沿往里切一块楔形，右边留一点蛋糕本体，绝不切到底部
    var nL = cw * (deep ? 0.606 : 0.650);
    var nR = cw * (deep ? 0.723 : 0.728);
    var nBot = ch * (deep ? 0.376 : 0.300);
    var kR = cw * (deep ? 0.024 : 0.014);
    var yTop = rimY(nL);
    var arcR = Math.min(nR, ccx + chw);

    function notchPath(g) {
      g.beginPath();
      g.moveTo(nL, yTop);
      for (var i = 1; i <= 12; i++) {
        var px = nL + (arcR - nL) * i / 12;
        g.lineTo(px, rimY(px));
      }
      g.quadraticCurveTo(nR + kR * 0.10, (rimY(nR) + nBot) * 0.55, nR - kR * 0.55, nBot);
      g.lineTo(nL + kR * 0.85, nBot);
      g.quadraticCurveTo(nL + kR * 0.32, (yTop + nBot) * 0.55, nL, yTop);
      g.closePath();
    }

    x.save();
    notchPath(x);
    x.globalCompositeOperation = 'destination-out';
    x.fill();
    x.restore();

    // 切面：补上内壁（奶油 + 夹层），否则看着像破了个洞
    x.save();
    notchPath(x);
    x.clip();

    var ly = nBot - yTop;
    var nx = nL - cw * 0.030;
    var nw = (nR - nL) + cw * 0.060;

    var fg = x.createLinearGradient(0, yTop, 0, nBot);
    fg.addColorStop(0, '#a8804f');
    fg.addColorStop(0.10, '#cbab7f');
    fg.addColorStop(0.40, '#ddc5a1');
    fg.addColorStop(0.74, '#d1b389');
    fg.addColorStop(1, '#a87e4c');
    x.fillStyle = fg;
    x.fillRect(nx, yTop - 2, nw, ly + 6);

    // 夹层
    var band = function (fy, fh, col) {
      x.fillStyle = col;
      x.fillRect(nx, yTop + ly * fy, nw, Math.max(1, ly * fh));
    };
    band(0.415, 0.034, 'rgba(190,70,98,0.70)');
    band(0.625, 0.026, 'rgba(243,230,208,0.50)');

    // 胚体的细孔，让切面像海绵蛋糕
    x.fillStyle = 'rgba(178,136,90,0.30)';
    for (var pi = 0; pi < 46; pi++) {
      var ppx = rand(nL, nR), ppy = rand(yTop + ly * 0.10, nBot - ly * 0.06);
      var ppf = (ppy - yTop) / ly;
      if (ppf > 0.40 && ppf < 0.47) continue;
      if (ppf > 0.61 && ppf < 0.67) continue;
      x.beginPath();
      x.arc(ppx, ppy, rand(0.6, 1.7) * (cw / 700), 0, TAU);
      x.fill();
    }

    // 顶部凹进去的环境暗影
    var ao = x.createLinearGradient(0, yTop, 0, yTop + ly * 0.30);
    ao.addColorStop(0, 'rgba(96,56,22,0.58)');
    ao.addColorStop(0.45, 'rgba(96,56,22,0.22)');
    ao.addColorStop(1, 'rgba(96,56,22,0)');
    x.fillStyle = ao;
    x.fillRect(nx, yTop, nw, ly * 0.30);

    // 两壁的暗边
    var wg = x.createLinearGradient(nL, 0, nR, 0);
    wg.addColorStop(0, 'rgba(88,52,20,0.46)');
    wg.addColorStop(0.10, 'rgba(88,52,20,0)');
    wg.addColorStop(0.88, 'rgba(88,52,20,0)');
    wg.addColorStop(1, 'rgba(88,52,20,0.40)');
    x.fillStyle = wg;
    x.fillRect(nL, yTop, nR - nL, ly);
    x.restore();

    // 切口轮廓，把蛋糕本体和凹进去的断面对开
    x.save();
    x.strokeStyle = 'rgba(112,68,30,0.26)';
    x.lineWidth = Math.max(1, cw * 0.0040);
    notchPath(x);
    x.stroke();
    x.restore();

    // 缺口上沿的一线高光，把深度顶出来
    x.strokeStyle = 'rgba(255,255,255,0.34)';
    x.lineWidth = Math.max(1, cw * 0.0030);
    x.beginPath();
    for (var j = 1; j <= 8; j++) {
      var qx = nL + (arcR - nL) * j / 9;
      j > 1 ? x.lineTo(qx, rimY(qx) + cw * 0.003) : x.moveTo(qx, rimY(qx) + cw * 0.003);
    }
    x.stroke();

    // 缺口边缘的奶油碎屑
    x.fillStyle = 'rgba(255,246,232,0.92)';
    for (var i = 0; i < (deep ? 20 : 12); i++) {
      x.beginPath();
      x.arc(rand(nL - cw * 0.024, nR + cw * 0.020), rand(yTop - ch * 0.028, nBot + ch * 0.008),
        rand(1.0, 2.9) * (cw / 700), 0, TAU);
      x.fill();
    }
    return { img: c, w: src.w, h: src.h, flames: src.flames };
  }

  /* ---------- 开场遮罩 ---------- */
  function initGate() {
    var gate = document.getElementById('gate');
    var auto = QS.get('t') || QS.get('scene') || QS.get('sim') || QS.get('freeze') || QS.get('st');
    if (auto) {
      if (gate) gate.style.display = 'none';
      started = true;
      return;
    }
    if (!gate) { started = true; return; }
    var closed = false;
    var open = function () {
      if (closed) return;
      closed = true;
      audUnlock();
      gate.classList.add('out');
      audSetMuted(AUD.muted);
      setTimeout(function () { gate.style.display = 'none'; }, 1200);
      started = true;
      last = 0;
      clockMs = 0;
      sfxTick(true);
    };
    gate.addEventListener('click', open);
    gate.addEventListener('touchstart', function (e) { e.preventDefault(); open(); }, { passive: false });
  }

  function showWish(on) {
    var w = document.getElementById('wish');
    if (!w) return;
    if (on) { if (!w.classList.contains('on')) w.classList.add('on'); }
    else if (w.classList.contains('on')) w.classList.remove('on');
  }

  function setEndUI(on) {
    var r = document.getElementById('replay');
    if (r) { if (on) r.classList.add('on'); else r.classList.remove('on'); }
    var c = document.getElementById('credit');
    if (c) { if (on) c.classList.add('on'); else c.classList.remove('on'); }
  }

    var isWX = /MicroMessenger/i.test(navigator.userAgent);

    var ga = document.getElementById('gateage');
    if (ga) ga.textContent = CONF.age || '';

    var gt = document.getElementById('gatetxt');

  function skipToScene() {
    if (clockMs > sceneAt - 400) return;
    fastForward();
    clockMs = sceneAt - 260;
    showSkip(false);

  function showSkip(on) {
    var sk = document.getElementById('skip');
    if (!sk) return;
    if (on) { if (!sk.classList.contains('on')) sk.classList.add('on'); }

  // ---------- 交互 ----------
  var charge = { down: false, t0: 0, x: 0, y: 0 };
  var lastDownAt = 0;

  function charBounds() {
    if (!charsReady || (!ST.backOn && !ST.frontOn) || ST.charA < 0.15) return null;
    var h = ST.charH, w = h * 0.68;
    return { x: ST.charX - w / 2, y: ST.charBase - h, w: w, h: h * 0.96 };
  }

  function hitChar(x, y) {
    var b = charBounds();
    return !!b && x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
  }

  function hitBox(x, y) {
    if (ST.phase !== 'idle' || !ST.boxOn) return false;
    var w = ST.boxW * 1.25;
    var h = ST.boxW * 0.95;
    return x > W / 2 - w / 2 && x < W / 2 + w / 2 &&
      y > ST.boxY - h && y < ST.boxY + h * 0.10;
  }

  function pokeChar() {
    var pool = ['shock', 'smile', 'cheer', 'sorry', 'eat'];
    ST.tapExpr = pool[(Math.random() * pool.length) | 0];
    ST.tapUntil = clockMs + 1200;
    ST.charSY = 1.06;
    sfxTick(true);
  }

  function onPointerDown(e) {
    var x, y;
    if (e.touches && e.touches.length) {
      x = e.touches[0].clientX; y = e.touches[0].clientY;
    } else {
      x = e.clientX; y = e.clientY;
    }
    if (!started) return;
    if (clockMs - lastDownAt < 45) return;      // 避免 pointer 与 touch 双触发
    lastDownAt = clockMs;
    mouse.x = x; mouse.y = y; mouse.inside = true;

    // 礼盒：碰一下就开
    if (hitBox(x, y)) {
      ST.openAt = clockMs;
      sfxTick(true);
      return;
    }

    // 点在蜡烛上 → 吹灭它，而不是放烟花
    if (ST.free && !cdl.allOut && hitCandle(x, y) !== -1) {
      startBlow();
      return;
    }

    // 戳她
    if (hitChar(x, y)) {
      pokeChar();
      return;
    }

    // 其它地方 → 放烟花（按住不放可以蓄力）
    charge.down = true; charge.t0 = clockMs; charge.x = x; charge.y = y;
    queueShell(0, x, Math.min(y, H * 0.62), true);
    if (confetti.length < 110) spawnConfetti(6, false);
    pushTrail(x, y);
  }

  function onPointerUp() {
    if (!charge.down) return;
    var held = clockMs - charge.t0;
    charge.down = false;
    if (held < 620) return;
    var cx0 = clamp(charge.x, W * 0.06, W * 0.94);
    var cy0 = clamp(charge.y, H * 0.05, H * 0.55);
    for (var i = 0; i < 5; i++) {
      queueShell(i * 68, clamp(cx0 + rand(-W * 0.16, W * 0.16), 12, W - 12),
        clamp(cy0 + rand(-H * 0.09, H * 0.05), H * 0.04, H * 0.58), true);
    }
    sfxBoom(1.4);
    addShake(6.5);
    for (var c = 0; c < 8; c++) spawnConfetti(4, false);
  }

  function drawChargeRing() {
    if (!charge.down) return;
    var held = clockMs - charge.t0;
    if (held < 620) return;
    var k = clamp((held - 620) / 1000, 0, 1);
    var r = 16 + k * 46;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(charge.x, charge.y, r * 0.2, charge.x, charge.y, r);
    g.addColorStop(0, 'rgba(255,238,190,' + (0.22 + 0.3 * k).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,170,70,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(charge.x, charge.y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,180,' + (0.35 + 0.4 * k).toFixed(3) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(charge.x, charge.y, r * 0.72, -Math.PI / 2, -Math.PI / 2 + TAU * k);
    ctx.stroke();
    ctx.restore();
  }

  function onPointerMove(e) {
    var x, y;
    if (e.touches && e.touches.length) {
      x = e.touches[0].clientX; y = e.touches[0].clientY;
    } else {
      x = e.clientX; y = e.clientY;
    }
    mouse.x = x; mouse.y = y; mouse.inside = true;
    pushTrail(x, y);

    // 快速划过蜡烛 = 扇风
    var tNow = (window.performance && performance.now) ? performance.now() : Date.now();
    if (ptrPrev && clockMs > sceneAt - 500 && !cdl.allOut) {
      var ddx = x - ptrPrev.x, ddy = y - ptrPrev.y;
      var dtt = Math.max(8, tNow - ptrPrev.t);
      if (dtt > 3) {
        var sp = Math.sqrt(ddx * ddx + ddy * ddy) / dtt;
        if (sp > 1.3) {
          var c1 = candleWorld(1);
          if (c1) {
            var nearX = Math.abs(x - c1.x) < W * 0.26;
            var nearY = Math.abs(y - c1.y) < H * 0.20;
            if (nearX && nearY) {
              blowWind(Math.min(0.42, sp * 0.13), ddx >= 0 ? 1 : -1);
              if (sp > 2.3) startBlow();
            }
          }
        }
      }
    }
    ptrPrev = { x: x, y: y, t: tNow };
  }

  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', function () { mouse.inside = false; });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    onPointerDown(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    onPointerMove(e);
  }, { passive: false });
  canvas.addEventListener('touchend', function () { mouse.inside = false; onPointerUp(); });
  canvas.addEventListener('touchcancel', function () { onPointerUp(); });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 200);
  });

  /* ==========================================================
     礼盒故事线：鲸鱼坠下礼盒 → 开盖 → 蛋糕 → 偷吃 → 被抓
                 → 心虚 → 切 → 走近 → 递到镜头前
     ========================================================== */
  var ST = {
    phase: 'pre', t: 0, openAt: 0, openSfx: 0, caughtSfx: 0, cutSfx: 0,
    propA: 0, cakeA: 0, cakeYOff: 0, cakeScale: 1, cakeImg: null,
    boxOn: false, boxA: 0, boxY: 0, boxW: 0, lidT: 0, boxGlow: 0, boxHint: 0,
    whaleA: 0, whaleP: 0,
    backOn: false, frontOn: false,
    charName: 'eat', charX: 0, charBase: 0, charH: 0,
    charA: 0, charTilt: 0, charDY: 0, charSX: 1, charSY: 1,
    symbol: '', symbolT: 0, sliceA: 0, blessA: 0,
    tapExpr: '', tapUntil: 0, free: false
  };
  var CRUMB = [];

  function ensureCakeVariants() {
    if (!SC || !SC.cake) return;
    if (!SC.cakeB1) SC.cakeB1 = biteVariant(SC.cake, false);
    if (!SC.cakeB2) SC.cakeB2 = biteVariant(SC.cake, true);
  }

  // 抛物线落地（返回相对落点的偏移，负数为上方）
  function landOffset(t) {
    if (t <= 0) return -H * 0.66;
    if (t >= 1) return 0;
    if (t < 0.84) {
      var a = t / 0.84;
      return -H * 0.66 * (1 - a) * (1 - a);
    }
    var b = (t - 0.84) / 0.16;
    return -Math.sin(b * Math.PI) * H * 0.030;
  }

  function updateStory(el, dt) {
    if (!SC) return;
    ensureCakeVariants();
    var cp = SC.cakePos, chH = SC.cake.h, cakeBase = cp.base;
    var base = el - sceneAt;

    ST.boxW = Math.min(W * 0.40, H * 0.255);
    ST.symbol = '';
    ST.free = false;

    if (base < 0) { ST.phase = 'pre'; return; }

    // ---- 鲸鱼掠过 + 礼盒落下 ----
    if (!ST.openAt && base < 4400) {
      ST.phase = 'whale';
      ST.whaleP = clamp(base / 4400, 0, 1);
      ST.whaleA = smooth(0, 0.10, ST.whaleP) * (1 - smooth(0.82, 1, ST.whaleP));
      ST.boxOn = base > 2100;
      ST.boxA = 1;
      ST.lidT = 0;
      ST.boxGlow = 0.18;
      ST.boxY = cakeBase + landOffset(clamp((base - 2200) / 1150, 0, 1));
      ST.cakeA = 0; ST.propA = 0;
      ST.backOn = false; ST.frontOn = false;
      return;
    }

    // ---- 安静等着被碰 ----
    if (!ST.openAt) {
      ST.phase = 'idle';
      ST.whaleA = 0;
      ST.boxOn = true; ST.boxA = 1; ST.lidT = 0;
      ST.boxY = cakeBase;
      ST.boxGlow = 0.16 + 0.10 * Math.sin(el * 0.0024);
      ST.boxHint = clamp((base - 3800) / 700, 0, 1);
      ST.cakeA = 0; ST.propA = 0;
      ST.backOn = false; ST.frontOn = false;
      return;
    }

    var t2 = el - ST.openAt;
    ST.boxHint = 0;

    // ---- 开盖 ----
    if (t2 < 900) {
      ST.phase = 'open';
      ST.lidT = smooth(0, 1, t2 / 900);
      ST.boxOn = true; ST.boxA = 1;
      ST.boxGlow = 0.72;
      ST.boxY = cakeBase;
      ST.cakeA = 0; ST.propA = 0;
      ST.backOn = false; ST.frontOn = false;
      if (!ST.openSfx) {
        ST.openSfx = 1;
        sfxLaunch(); sfxBoom(0.75);
        addShake(3.2);
        playBirthdaySong();
      }
      return;
    }

    // ---- 蛋糕升起来 ----
    if (t2 < 2050) {
      var r = smooth(0, 1, (t2 - 900) / 1150);
      ST.phase = 'rise';
      ST.lidT = 1;
      ST.boxA = 1 - r * 1.6;
      ST.boxOn = ST.boxA > 0.03;
      ST.boxY = cakeBase + r * chH * 0.10;
      ST.boxGlow = Math.max(0, 1 - r * 1.8);
      ST.cakeA = r;
      ST.cakeScale = 0.82 + 0.18 * r;
      ST.cakeYOff = (1 - r) * chH * 0.42;
      ST.cakeImg = null;
      ST.propA = 0;
      ST.backOn = false; ST.frontOn = false;
      return;
    }

    // 之后的公共量
    ST.cakeA = 1; ST.cakeScale = 1; ST.cakeYOff = 0;
    ST.boxOn = false; ST.boxA = 0; ST.boxGlow = 0;

    // ---- 偷吃 ----
    if (t2 < 4650) {
      var e0 = t2 - 2050;
      ST.phase = 'eat';
      ST.cakeImg = e0 > 640 ? SC.cakeB1 : null;
      ST.backOn = true; ST.frontOn = false;
      ST.charName = (ST.tapExpr && el < ST.tapUntil) ? ST.tapExpr : 'eat';
      ST.charH = chH * 1.55;
      ST.charX = cp.x - SC.cake.w * 0.10;
      ST.charBase = cakeBase - chH * 0.26;
      ST.charDY = Math.sin(el * 0.0074) * chH * 0.013;
      ST.charSY = 1 + Math.sin(el * 0.0074) * 0.020;
      ST.charTilt = Math.sin(el * 0.0032) * 0.022;
      ST.charA = smooth(0, 1, e0 / 240);
      return;
    }

    // ---- 被抓包 ----
    if (t2 < 5550) {
      var e1 = t2 - 4650;
      ST.phase = 'caught';
      if (!ST.caughtSfx) {
        ST.caughtSfx = 1;
        sfxTick(false);
        addShake(9.5);
        flashA = 0.58;
        for (var ci = 0; ci < 14; ci++) {
          CRUMB.push({
            x: cp.x + rand(-chH * 0.2, chH * 0.2), y: cakeBase - chH * 0.75,
            vx: rand(-2.4, 2.4), vy: rand(-3.4, -0.6),
            r: rand(1.4, 3.4), life: 1
          });
        }
      }
      ST.cakeImg = SC.cakeB1;
      ST.backOn = true;
      ST.charName = 'shock';
      ST.charH = chH * 1.55;
      ST.charX = cp.x - SC.cake.w * 0.10;
      ST.charBase = cakeBase - chH * 0.26 + Math.sin(e1 * 0.028) * 2.4;
      ST.charTilt = Math.sin(e1 * 0.032) * 0.055 * Math.max(0, 1 - e1 / 620);
      ST.charSY = 1 + (e1 < 130 ? 0.07 : 0);
      ST.charA = 1;
      ST.symbol = '!';
      ST.symbolT = e1;
      return;
    }

    // ---- 心虚求原谅 ----
    if (t2 < 7050) {
      var e2 = t2 - 5550;
      ST.phase = 'sorry';
      ST.cakeImg = SC.cakeB1;
      ST.backOn = true;
      ST.charName = 'sorry';
      ST.charH = chH * 1.55;
      ST.charX = cp.x - SC.cake.w * 0.10;
      ST.charBase = cakeBase - chH * 0.26 + smooth(0, 500, e2) * chH * 0.06;
      ST.charDY = Math.sin(el * 0.0018) * 2;
      ST.charTilt = -0.02;
      ST.charA = 1;
      if (e2 < 900) { ST.symbol = 'sweat'; ST.symbolT = e2; }
      return;
    }

    // ---- 切一块 ----
    if (t2 < 8350) {
      var e3 = t2 - 7050;
      ST.phase = 'cut';
      ST.cakeImg = e3 > 620 ? SC.cakeB2 : SC.cakeB1;
      ST.backOn = true;
      ST.charName = 'smile';
      ST.charH = chH * 1.55;
      ST.charX = cp.x - SC.cake.w * 0.10;
      ST.charBase = cakeBase - chH * 0.26;
      ST.charDY = Math.sin(el * 0.0062) * 2.6;
      ST.charA = 1;
      if (e3 > 520 && !ST.cutSfx) {
        ST.cutSfx = 1;
        sfxPuff();
        for (var k = 0; k < 16; k++) {
          CRUMB.push({
            x: cp.x + SC.cake.w * 0.12 + rand(-6, 6), y: cakeBase - chH * 0.58,
            vx: rand(-1.6, 1.6), vy: rand(-2.6, -0.4),
            r: rand(1.2, 3.0), life: 1
          });
        }
      }
      return;
    }

    // ---- 走向镜头 ----
    if (t2 < 10250) {
      var w0 = (t2 - 8350) / 1900;
      var eo = smooth(0, 1, w0);
      ST.phase = 'walk';
      ST.cakeImg = SC.cakeB2;
      ST.backOn = false; ST.frontOn = true;
      ST.charName = (ST.tapExpr && el < ST.tapUntil) ? ST.tapExpr : 'walk';
      var h0 = chH * 1.55, h1 = H * 0.62;
      ST.charH = h0 + (h1 - h0) * eo;
      ST.charX = (cp.x - SC.cake.w * 0.10) + (W * 0.5 - (cp.x - SC.cake.w * 0.10)) * eo;
      ST.charBase = (cakeBase - chH * 0.26) + (H * 1.02 - (cakeBase - chH * 0.26)) * eo;
      ST.charDY = -Math.abs(Math.sin(w0 * Math.PI * 3.0)) * ST.charH * 0.024;
      ST.charTilt = Math.sin(w0 * Math.PI * 3.0) * 0.022;
      ST.charA = 1;
      ST.blessA = 0;
      return;
    }

    // ---- 递到镜头前 + 道贺 ----
    if (t2 < 13250) {
      var o0 = t2 - 10250;
      ST.phase = 'offer';
      ST.cakeImg = SC.cakeB2;
      ST.frontOn = true;
      ST.charName = (ST.tapExpr && el < ST.tapUntil) ? ST.tapExpr : 'sorry';
      ST.charH = H * 0.62;
      ST.charX = W * 0.5;
      ST.charBase = H * 1.02;
      ST.charDY = Math.sin(el * 0.0022) * H * 0.0035;
      ST.charA = 1;
      ST.sliceA = smooth(0, 1, o0 / 520);
      ST.blessA = smooth(700, 1700, o0);
      if (ST.blessA > 0.34) showWish(true);
      return;
    }

    // ---- 退场 ----
    if (t2 < 14650) {
      var x0 = (t2 - 13250) / 1400;
      var xo = smooth(0, 1, x0);
      ST.phase = 'exit';
      ST.cakeImg = SC.cakeB2;
      ST.frontOn = true;
      ST.charName = 'cheer';
      ST.charH = H * 0.62;
      ST.charX = W * 0.5;
      ST.charBase = H * 1.02 + xo * H * 0.46;
      ST.charDY = -Math.abs(Math.sin(x0 * Math.PI * 2)) * H * 0.012;
      ST.charA = 1 - smooth(0.58, 1, x0);
      ST.sliceA = 1 - smooth(0.10, 0.62, x0);
      ST.blessA = 1;
      if (x0 > 0.4) showWish(false);
      return;
    }

    // ---- 回到正片 ----
    ST.phase = 'free';
    ST.free = true;
    ST.frontOn = false; ST.backOn = false;
    ST.cakeImg = SC.cakeB2;
    ST.blessA = 0;
    ST.propA = smooth(0, 1, (t2 - 14650) / 1500);
    showWish(false);
  }

  // 角色图层
  function drawCharLayer(front) {
    if (!charsReady || ST.charA <= 0.01) return;
    var bx = ST.charX, by = ST.charBase + (ST.charDY || 0);

    // 地面投影
    ctx.save();
    ctx.globalAlpha = 0.34 * ST.charA;
    var sw = ST.charH * 0.34;
    var sg = ctx.createRadialGradient(bx, by, 2, bx, by, sw);
    sg.addColorStop(0, 'rgba(0,0,0,0.55)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.ellipse(bx, by - ST.charH * 0.01, sw, sw * 0.26, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    drawChar(ST.charName, bx, by, ST.charH, {
      alpha: ST.charA,
      tilt: ST.charTilt,
      sx: ST.charSX,
      sy: ST.charSY
    });

    // 头顶的情绪符号（只在后半层画）
    if (!front && ST.symbol) {
      var hx = bx + ST.charH * 0.13;
      var hy = by - ST.charH * 1.235;
      drawSymbol(ST.symbol, hx, hy, ST.charH, ST.symbolT, ST.charA);
    }

    // 递出去的蛋糕
    if (front && ST.sliceA > 0.02) {
      drawSlice(bx, by - ST.charH * 0.475, ST.charH * 0.185, ST.sliceA * ST.charA);
    }
  }

  function drawSymbol(kind, x, y, h, t, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    var pop = clamp(t / 180, 0, 1);
    pop = pop * (1.25 - 0.25 * pop);
    ctx.translate(x, y);
    ctx.scale(pop, pop);
    ctx.globalCompositeOperation = 'lighter';

    if (kind === '!') {
      var w1 = h * 0.052, w2 = h * 0.019;
      var h1 = h * 0.125, dotR = h * 0.024, gp = h * 0.022;
      var gd = ctx.createLinearGradient(0, 0, 0, h1);
      gd.addColorStop(0, '#fffaea');
      gd.addColorStop(0.55, '#ffd98c');
      gd.addColorStop(1, '#f7a93c');
      ctx.shadowColor = 'rgba(255,176,70,0.9)';
      ctx.shadowBlur = h * 0.07;
      ctx.fillStyle = gd;
      ctx.beginPath();
      ctx.moveTo(-w1 / 2, 0);
      ctx.lineTo(w1 / 2, 0);
      ctx.lineTo(w2 / 2, h1);
      ctx.quadraticCurveTo(0, h1 + w2 * 1.1, -w2 / 2, h1);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, h1 + gp + dotR, dotR, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      // 一滴汗
      ctx.fillStyle = 'rgba(186,226,255,0.92)';
      ctx.beginPath();
      ctx.moveTo(h * 0.135, h * 0.045);
      ctx.quadraticCurveTo(h * 0.180, h * 0.105, h * 0.135, h * 0.128);
      ctx.quadraticCurveTo(h * 0.090, h * 0.105, h * 0.135, h * 0.045);
      ctx.fill();
    } else if (kind === 'sweat') {
      ctx.fillStyle = 'rgba(170,220,255,0.85)';
      ctx.beginPath();
      ctx.moveTo(0, -h * 0.04);
      ctx.quadraticCurveTo(h * 0.05, h * 0.04, 0, h * 0.07);
      ctx.quadraticCurveTo(-h * 0.05, h * 0.04, 0, -h * 0.04);
      ctx.fill();
    }
    ctx.restore();
  }

  // 一小块蛋糕
  function drawSlice(x, y, s, a) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    ctx.scale(s, s);

    // 盘子
    ctx.fillStyle = 'rgba(255,250,238,0.95)';
    ctx.beginPath();
    ctx.ellipse(0, 0.30, 0.62, 0.16, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(196,158,110,0.55)';
    ctx.beginPath();
    ctx.ellipse(0, 0.33, 0.62, 0.11, 0, 0, TAU);
    ctx.fill();

    // 蛋糕体（侧视梯形）
    ctx.beginPath();
    ctx.moveTo(-0.42, 0.26);
    ctx.lineTo(-0.36, -0.10);
    ctx.lineTo(0.36, -0.02);
    ctx.lineTo(0.40, 0.26);
    ctx.closePath();
    ctx.fillStyle = '#f0d09a';
    ctx.fill();

    // 夹层
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#fff6e6';
    ctx.fillRect(-0.5, -0.14, 1.0, 0.10);
    ctx.fillStyle = '#e2627f';
    ctx.fillRect(-0.5, 0.06, 1.0, 0.07);
    ctx.fillStyle = '#ffedf2';
    ctx.fillRect(-0.5, 0.13, 1.0, 0.05);
    ctx.restore();

    // 顶部奶油
    ctx.fillStyle = '#fffaf1';
    ctx.beginPath();
    ctx.moveTo(-0.37, -0.10);
    ctx.lineTo(0.36, -0.02);
    ctx.lineTo(0.33, -0.09);
    ctx.lineTo(-0.34, -0.17);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.30, -0.08, 0.055, 0, TAU);
    ctx.fill();

    // 樱桃
    ctx.fillStyle = '#e0415c';
    ctx.beginPath();
    ctx.arc(0.06, -0.19, 0.062, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,30,0.8)';
    ctx.lineWidth = 0.016;
    ctx.beginPath();
    ctx.moveTo(0.06, -0.24);
    ctx.quadraticCurveTo(0.10, -0.34, 0.16, -0.33);
    ctx.stroke();

    ctx.restore();
  }

  function updateCrumb(dt) {
    var f = Math.min(dt / 16.667, 3);
    for (var i = CRUMB.length - 1; i >= 0; i--) {
      var p = CRUMB[i];
      p.vy += 0.24 * f;
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.life -= 0.012 * f;
      if (p.life <= 0) CRUMB.splice(i, 1);
    }
  }

  function drawCrumb() {
    if (!CRUMB.length) return;
    ctx.save();
    for (var i = 0; i < CRUMB.length; i++) {
      var p = CRUMB[i];
      ctx.globalAlpha = Math.max(0, p.life) * 0.9;
      ctx.fillStyle = '#fff4e0';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // 碰一下 / 跳过 的提示文字
  function drawBoxHint() {
    if (!ST.boxOn || ST.boxHint <= 0.02) return;
    var y = ST.boxY + H * 0.085;
    var a = ST.boxHint * (0.55 + 0.45 * Math.sin(clockMs * 0.0032));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 ' + Math.round(Math.min(W, H) * 0.030) + 'px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(255,234,196,0.95)';
    ctx.shadowColor = 'rgba(255,180,90,0.65)';
    ctx.shadowBlur = 16;
    ctx.fillText('碰一下', W / 2, y);
    ctx.restore();
  }

  // ---------- 启动 ----------
  function fastForward() {
    clockMs = T_BURST + 4200;
    burstDone = true;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x = p.tx; p.y = p.ty;
      p.vx = 0; p.vy = 0; p.alpha = 1;
    }
    document.getElementById('sub').classList.add('on');
    document.getElementById('hint').classList.add('on');
    lastWordSwap = clockMs;
  }

  function boot() {
    initSprites();
    initNebula();
    buildLantern();
    initUI();
    initBlowUI();
    initAudioUI();
    loadChars();
    resize();
    initGate();

    if (SCENE_NOW) {
      clockMs = sceneAt + 6000;
      burstDone = true;
      spawnConfetti(W < 760 ? 40 : 66, true);
      for (var i = 0; i < particles.length; i++) { particles[i].alpha = 0; }
      // 调试：?blow=1 自动吹灭（可配 &sim2=毫秒 同步推进）
      if (QS.get('blow')) {
        startBlow();
        var bs = parseFloat(QS.get('sim2')) || 0;
        if (bs > 0) {
          var bsteps = Math.round(bs / 16.7);
          for (var bi3 = 0; bi3 < bsteps; bi3++) {
            clockMs += 16.7;
            updateCandles(16.7);
            updateFireworks(16.7);
            updateConfetti(16.7);
          }
          FREEZE_AT = clockMs;
          SIM_HOLD = true;
        }
      }
    } else if (SIM_MS > 0) {
      // 调试：把开场爆发瞬间快进出来
      clockMs = T_BURST;
      burstDone = true;
      for (var si2 = 0; si2 < particles.length; si2++) {
        var ps = particles[si2];
        ps.x = ps.tx; ps.y = ps.ty; ps.vx = 0; ps.vy = 0; ps.alpha = 1;
      }
      lastWordSwap = clockMs;
      fireBarrage();
      spawnConfetti(W < 760 ? 50 : 84, true);
      var steps2 = Math.round(SIM_MS / 16.7);
      for (var s3 = 0; s3 < steps2; s3++) {
        clockMs += 16.7;
        updateFireworks(16.7);
        updateConfetti(16.7);
      }
      FREEZE_AT = clockMs;
      SIM_HOLD = true;
    } else if (SKIP_MS > 0) {
      fastForward();
      if (SKIP_MS > 1) clockMs = SKIP_MS;
    }

    // 调试：?st=毫秒 直接跳到故事线某一点（礼盒视为已在 +4400 被点开）
    if (QS.get('st')) {
      var stt = parseFloat(QS.get('st')) || 0;
      burstDone = true;
      for (var sti = 0; sti < particles.length; sti++) {
        var sp3 = particles[sti];
        sp3.x = sp3.tx; sp3.y = sp3.ty; sp3.vx = 0; sp3.vy = 0; sp3.alpha = 1;
      }
      if (stt >= 4400) ST.openAt = sceneAt + 4400;
      clockMs = sceneAt + Math.max(1000, stt);
      if (QS.get('hold')) FREEZE_AT = clockMs;
      document.getElementById('sub').classList.remove('on');
      document.getElementById('hint').classList.remove('on');
    }

    requestAnimationFrame(frame);
  }

  boot();



})();
</script>
