  // 画灯：x 为水平中心，baseY 为底部，h 为总高
  function drawLantern(x, baseY, h, now, dtf) {
    if (!LANT.done) buildLantern();
    var s = h / 660;
    var left = x - 220 * s;
    // 精灵底部有 40px 留白，按实际底沿(620)对齐，避免"悬空"
    var top = baseY - 622 * s;
    var gcx = x, gcy = top + 330 * s, gr = 132 * s;

    // 背后的暖光圈
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var pulse = 0.86 + 0.14 * Math.sin(now * 0.0011);
    var halo = ctx.createRadialGradient(gcx, gcy, gr * 0.2, gcx, gcy, gr * 2.6);
    halo.addColorStop(0, 'rgba(255,214,150,' + (0.30 * pulse) + ')');
    halo.addColorStop(0.35, 'rgba(255,170,90,' + (0.12 * pulse) + ')');
    halo.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(gcx - gr * 2.6, gcy - gr * 2.6, gr * 5.2, gr * 5.2);
    ctx.restore();

    ctx.drawImage(LANT.back, left, top, 440 * s, h);

    // 球内飘雪
    ctx.save();
    ctx.beginPath();
    ctx.arc(gcx, gcy, gr * 0.985, 0, TAU);
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < SNOW.length; i++) {
      var sn = SNOW[i];
      sn.v += sn.sp * dtf;
      sn.u += Math.sin(now * 0.0007 + sn.ph) * 0.0016 * sn.sw * dtf;
      if (sn.v > 1.02) { sn.v = -1.02; sn.u = rand(-0.9, 0.9); }
      if (sn.u > 1.1) sn.u = -1.1;
      if (sn.u < -1.1) sn.u = 1.1;
      var px = gcx + sn.u * gr;
      var py = gcy + sn.v * gr;
      var rr2 = sn.r * (0.7 + 0.5 * (1 - Math.abs(sn.v)) ) * Math.max(0.6, s * 1.1);
      ctx.globalAlpha = 0.62 + 0.38 * Math.sin(now * 0.002 + sn.ph);
      ctx.drawImage(SPRITE_WHITE, px - rr2 * 1.6, py - rr2 * 1.6, rr2 * 3.2, rr2 * 3.2);
      if (sn.big) {
        ctx.globalAlpha *= 0.8;
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = Math.max(0.6, 0.9 * s * 1.4);
        ctx.beginPath();
        for (var a6 = 0; a6 < 3; a6++) {
          var an = a6 * Math.PI / 3;
          var dx = Math.cos(an) * rr2 * 2.0, dy = Math.sin(an) * rr2 * 2.0;
          ctx.moveTo(px - dx, py - dy); ctx.lineTo(px + dx, py + dy);
        }
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.drawImage(LANT.front, left, top, 440 * s, h);
  }

  // ==========================================================
  //  文字 → 粒子
  // ==========================================================
  var particles = [], targets = [], wordsCache = null, glowCache = {};
  var wordIdx = 0, lastWordSwap = 0, currentWord = '', wordAt = 0, cycles = 0;

  var CN_RE = /[\u4e00-\u9fa5]/;

  function getWords() {
    var arr = ['HAPPY BIRTHDAY', String(CONF.age || 20), '生日快乐'];
    if (CONF.name && CONF.name.length) arr.push(CONF.name);
    if (W > 0 && W < 780) arr[0] = 'HAPPY\nBIRTHDAY';
    return arr;
  }

  function layoutWord(word) {
    var lines = word.split('\n');
    var lineCount = lines.length;
    var longest = 1;
    for (var li = 0; li < lineCount; li++) {
      if (lines[li].length > longest) longest = lines[li].length;
    }

    var isCN = CN_RE.test(word);
    var family = isCN
      ? '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'
      : '"Helvetica Neue","Arial Black",Arial,sans-serif';
    var weight = isCN ? 700 : 800;

    var offW = Math.max(320, Math.floor(W));
    var offH = Math.max(240, Math.floor(H));
    var narrow = W < 700;
    var maxW = W * (narrow ? 0.84 : 0.68);
    var maxH = H * (narrow ? 0.34 : 0.28);
    var fs = Math.min(
      maxW / Math.max(1, longest) * (isCN ? 1.05 : 1.55),
      maxH / lineCount
    );

    var probe = document.createElement('canvas').getContext('2d');
    probe.font = weight + ' ' + Math.floor(fs) + 'px ' + family;
    var widest = 0;
    for (var lj = 0; lj < lineCount; lj++) {
      var mw = probe.measureText(lines[lj]).width;
      if (mw > widest) widest = mw;
    }
    if (widest > maxW) fs = fs * maxW / widest;
    if (fs * lineCount > maxH) fs = Math.floor(maxH / lineCount);

    var lineH = fs * 1.12;
    var cy = H * (W < 700 ? 0.475 : 0.495);
    var startY = cy - (lineH * lineCount) / 2 + lineH / 2;

    return {
      lines: lines, fs: fs, family: family, weight: weight,
      lineH: lineH, startY: startY, cy: cy,
      x: W * (narrow ? 0.5 : 0.472),
      offW: offW, offH: offH
    };
  }

  function buildTargets(word) {
    if (wordsCache && wordsCache[word]) return wordsCache[word];
    if (!wordsCache) wordsCache = {};

    var L = layoutWord(word);
    var off = document.createElement('canvas');
    off.width = L.offW; off.height = L.offH;
    var o = off.getContext('2d');

    o.font = L.weight + ' ' + Math.floor(L.fs) + 'px ' + L.family;
    o.textAlign = 'center';
    o.textBaseline = 'middle';
    o.fillStyle = '#fff';
    for (var lk = 0; lk < L.lines.length; lk++) {
      o.fillText(L.lines[lk], L.x, L.startY + lk * L.lineH);
    }

    var img = o.getImageData(0, 0, off.width, off.height).data;
    var pts = [];
    for (var gap = 3; gap <= 16; gap++) {
      pts = [];
      for (var y = 0; y < off.height; y += gap) {
        for (var x = 0; x < off.width; x += gap) {
          if (img[(y * off.width + x) * 4 + 3] > 130) {
            pts.push({ x: x, y: y });
          }
        }
      }
      if (pts.length <= 4200) break;
    }

    wordsCache[word] = pts;
    return pts;
  }

  function buildGlow(word) {
    if (glowCache[word]) return glowCache[word];
    var L = layoutWord(word);
    var cw = L.offW, ch = L.offH;

    var base = document.createElement('canvas');
    base.width = cw; base.height = ch;
    var b = base.getContext('2d');
    b.font = L.weight + ' ' + Math.floor(L.fs) + 'px ' + L.family;
    b.textAlign = 'center';
    b.textBaseline = 'middle';
    b.fillStyle = '#fff';
    for (var i = 0; i < L.lines.length; i++) {
      b.fillText(L.lines[i], L.x, L.startY + i * L.lineH);
    }

    b.globalCompositeOperation = 'source-in';
    var lg = b.createLinearGradient(0, L.cy - L.fs * 0.62, 0, L.cy + L.fs * 0.62);
    lg.addColorStop(0, 'rgba(255,248,220,1)');
    lg.addColorStop(0.42, 'rgba(255,208,136,1)');
    lg.addColorStop(1, 'rgba(255,166,84,1)');
    b.fillStyle = lg;
    b.fillRect(0, 0, cw, ch);

    var soft = document.createElement('canvas');
    soft.width = cw; soft.height = ch;
    var sc = soft.getContext('2d');
    if (typeof sc.filter === 'string') {
      sc.filter = 'blur(' + Math.round(Math.max(7, L.fs * 0.055)) + 'px)';
      sc.drawImage(base, 0, 0);
      sc.filter = 'none';
      sc.globalCompositeOperation = 'lighter';
      sc.globalAlpha = 0.55;
      sc.drawImage(base, 0, 0);
    } else {
      sc.drawImage(base, 0, 0);
    }

    glowCache[word] = { soft: soft, solid: base };
    return glowCache[word];
  }

  function drawTextGlow(word, amt) {
    if (amt <= 0.01 || !word) return;
    var g = glowCache[word] || buildGlow(word);
    if (!g) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.52 * amt;
    ctx.drawImage(g.soft, 0, 0);
    ctx.globalAlpha = 0.15 * amt;
    ctx.drawImage(g.solid, 0, 0);
    ctx.restore();
  }

  function Particle() {
    this.x = W / 2 + rand(-16, 16);
    this.y = H * 0.46 + rand(-16, 16);
    this.vx = 0; this.vy = 0;
    this.tx = W / 2; this.ty = H * 0.46;
    this.size = rand(2.2, 5.4);
    this.white = Math.random() < 0.14;
    this.alpha = 0;
    this.phase = rand(0, TAU);
    this.flick = rand(0.5, 2.2);
    this.ox = rand(-1.6, 1.6);
    this.oy = rand(-1.6, 1.6);
  }

  function buildParticles() {
    var words = getWords();
    var maxLen = 0;
    for (var i = 0; i < words.length; i++) {
      var n = buildTargets(words[i]).length;
      if (n > maxLen) maxLen = n;
    }
    var N = Math.max(600, Math.ceil(maxLen * 0.92));
    particles = [];
    for (var j = 0; j < N; j++) particles.push(new Particle());
    applyWord(START_WORD);
    // 每句都播一遍之后进暖场画面
    sceneAt = T_TEXT + WORD_HOLD * words.length + 900;
  }

  function applyWord(idx) {
    var words = getWords();
    wordIdx = idx % words.length;
    currentWord = words[wordIdx];
    wordAt = clockMs;
    var tg = buildTargets(currentWord);
    if (!tg.length) return;
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var t = tg[i % tg.length];
      p.tx = t.x + p.ox;
      p.ty = t.y + p.oy;
    }
  }

  function doBurst() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = rand(0, TAU);
      var sp = rand(3, 19);
      p.vx = Math.cos(a) * sp;
      p.vy = Math.sin(a) * sp;
    }
    sfxBoom(1.45);
  }

  // ==========================================================
  //  烟花：一束升起 → 空中炸开 → 向四周散开
  // ==========================================================
  var shells = [], sparks = [], flashes = [], rings = [], launchQ = [];
  var MAX_SPARKS = 3200;
  var HUE_SET = [45, 32, 350, 196, 286, 15, 320, 165];

  function pushSpark(s) {
    if (sparks.length >= MAX_SPARKS) sparks.splice(0, 120);
    sparks.push(s);
  }

  function launchShell(x0, ty, big) {
    var k = clamp(Math.min(W, H) / 820, 0.75, 1.6);
    var h1 = HUE_SET[(Math.random() * HUE_SET.length) | 0] + rand(-10, 10);
    var h2 = Math.random() < 0.5 ? h1 + rand(40, 80) : h1;
    var y0 = H * 1.03;
    var dy = Math.max(160, y0 - ty);
    shells.push({
      x: x0, y: y0, px: x0, py: y0,
      vx: rand(-0.6, 0.6),
      vy: -Math.sqrt(2 * 0.32 * dy) * rand(1.0, 1.04),
      ty: ty,
      h1: h1, h2: h2,
      n: big ? 120 : 82,
      spread: (big ? rand(4.8, 7.2) : rand(3.0, 4.4)) * k,
      k: k,
      willow: Math.random() < 0.10,
      ring: Math.random() < 0.12
    });
    sfxLaunch();
  }

  function queueShell(delay, x, ty, big) {
    launchQ.push({ at: clockMs + delay, x: x, ty: ty, big: !!big });
  }

  // 开场/高潮：一片同时绽放
  function fireBarrage() {
    var n = W < 760 ? 9 : 13;
    for (var i = 0; i < n; i++) {
      var x = W * (0.05 + 0.90 * Math.random());
      var ty = H * (0.10 + 0.32 * Math.random());
      queueShell(i * 55 + Math.random() * 120, x, ty, true);
    }
    queueShell(80, W * 0.13, H * 0.26, true);
    queueShell(180, W * 0.87, H * 0.22, true);
    queueShell(340, W * 0.5, H * 0.13, true);
  }

  function explode(s) {
    var cx = s.x, cy = s.y;
    for (var i = 0; i < s.n; i++) {
      var a;
      if (s.ring) a = i / s.n * TAU + rand(-0.035, 0.035);
      else a = rand(0, TAU);
      var sp = s.ring ? s.spread * rand(0.95, 1.02)
        : s.spread * (0.35 + 0.65 * Math.sqrt(Math.random()));
      var gold = Math.random() < 0.28;
      var hue = Math.random() < 0.55 ? s.h1 : s.h2;
      pushSpark({
        x: cx, y: cy, px: cx, py: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: s.willow ? rand(0.0048, 0.0072) : rand(0.0058, 0.0110),
        hue: gold ? 45 : hue + rand(-14, 14),
        sat: gold ? 100 : rand(88, 100),
        lig: gold ? rand(72, 90) : rand(60, 78),
        size: s.k * rand(1.1, 2.6),
        tw: Math.random() < 0.45 ? rand(0.10, 0.22) : 0,
        ph: rand(0, TAU),
        g: s.willow ? 0.030 : rand(0.028, 0.042)
      });
    }
    // 中心白闪
    for (var j = 0; j < 16; j++) {
      var a2 = rand(0, TAU), sp2 = s.spread * rand(0.15, 1.1);
      pushSpark({
        x: cx, y: cy, px: cx, py: cy,
        vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2,
        life: 1, decay: 0.030, hue: 48, sat: 100, lig: 97,
        size: s.k * 2.4, tw: 0, ph: 0, g: 0.02
      });
    }
    flashes.push({ x: cx, y: cy, life: 1, k: s.k });
    rings.push({ x: cx, y: cy, r: s.spread * 2, life: 1, hue: s.h1 });
    sfxBoom(s.n >= 110 ? 1.0 : 0.58);
  }

  function updateFireworks(dt) {
    var f = Math.min(dt / 16.667, 3);

    for (var q = launchQ.length - 1; q >= 0; q--) {
      if (clockMs >= launchQ[q].at) {
        launchShell(launchQ[q].x, launchQ[q].ty, launchQ[q].big);
        launchQ.splice(q, 1);
      }
    }

    for (var i = shells.length - 1; i >= 0; i--) {
      var s = shells[i];
      s.px = s.x; s.py = s.y;
      s.vy += 0.32 * f;
      s.x += s.vx * f;
      s.y += s.vy * f;

      // 拖尾火星
      for (var t2 = 0; t2 < 2; t2++) {
        pushSpark({
          x: s.x + rand(-1.6, 1.6), y: s.y + rand(0, 8),
          px: s.x, py: s.y + 10,
          vx: rand(-0.6, 0.6), vy: rand(0.3, 1.6),
          life: 1, decay: rand(0.030, 0.052),
          hue: 42, sat: 100, lig: rand(76, 96),
          size: s.k * rand(1.0, 2.2), tw: 0, ph: 0, g: 0.010
        });
      }

      if (s.y <= s.ty || s.vy >= -0.7) {
        explode(s);
        shells.splice(i, 1);
      }
    }

    for (var j = sparks.length - 1; j >= 0; j--) {
      var p = sparks[j];
      p.px = p.x; p.py = p.y;
      p.vy += p.g * f;
      var drag = Math.pow(0.976, f);
      p.vx *= drag; p.vy *= drag;
      p.x += p.vx * f; p.y += p.vy * f;
      p.life -= p.decay * f;
      if (p.life <= 0) sparks.splice(j, 1);
    }

    for (var m = flashes.length - 1; m >= 0; m--) {
      flashes[m].life -= 0.055 * f;
      if (flashes[m].life <= 0) flashes.splice(m, 1);
    }
    for (var r = rings.length - 1; r >= 0; r--) {
      rings[r].life -= 0.024 * f;
      if (rings[r].life <= 0) rings.splice(r, 1);
    }
  }

  function drawFireworks(alpha) {
    alpha = alpha == null ? 1 : alpha;
    if (!sparks.length && !shells.length && !flashes.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 中心闪光
    for (var m = 0; m < flashes.length; m++) {
      var fl = flashes[m];
      var fr = 240 * fl.k * (1.4 - fl.life);
      ctx.globalAlpha = fl.life * 0.5 * alpha;
      ctx.drawImage(SPRITE_SOFT, fl.x - fr, fl.y - fr, fr * 2, fr * 2);
    }

    // 冲击波环
    for (var r = 0; r < rings.length; r++) {
      var rg = rings[r];
      var rad = rg.r * (1 - rg.life) * 3.6;
      ctx.globalAlpha = rg.life * 0.20 * alpha;
      ctx.strokeStyle = 'hsla(' + rg.hue + ',100%,80%,1)';
      ctx.lineWidth = 1.8 * (1 - rg.life) + 0.4;
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rad, 0, TAU);
      ctx.stroke();
    }

    // 弹体头（带一道亮尾）
    for (var s = 0; s < shells.length; s++) {
      var sh = shells[s];
      ctx.globalAlpha = 0.9 * alpha;
      ctx.strokeStyle = 'rgba(255,228,160,0.55)';
      ctx.lineWidth = 2.2 * sh.k;
      ctx.beginPath();
      ctx.moveTo(sh.x, sh.y);
      ctx.lineTo(sh.x - sh.vx * 2.2, sh.y - sh.vy * 2.2);
      ctx.stroke();
      ctx.globalAlpha = 0.95 * alpha;
      ctx.drawImage(SPRITE_GOLD, sh.x - 11 * sh.k, sh.y - 11 * sh.k, 22 * sh.k, 22 * sh.k);
    }

    // 火星：按色相 + 亮度 + 透明度分桶批绘
    var buckets = {};
    for (var i = 0; i < sparks.length; i++) {
      var p = sparks[i];
      var a = p.life * p.life * alpha;
      if (a < 0.03) continue;
      if (p.tw > 0) a *= 1 - p.tw + p.tw * (0.5 + 0.5 * Math.sin(clockMs * 0.02 + p.ph));
      var lv = a >= 0.78 ? 4 : (a >= 0.52 ? 3 : (a >= 0.30 ? 2 : (a >= 0.14 ? 1 : 0)));
      var key = (p.hue | 0) + '_' + Math.round(p.lig / 9) + '_' + lv;
      var bk = buckets[key];
      if (!bk) {
        bk = buckets[key] = { hue: p.hue, sat: p.sat, lig: p.lig, lv: lv, d: [], w: 0, n: 0 };
      }
      bk.d.push(p.x, p.y, p.x - p.vx * 2.1, p.y - p.vy * 2.1);
      bk.w += p.size; bk.n++;
    }

    ctx.lineCap = 'round';
    for (var kk in buckets) {
      var B = buckets[kk];
      ctx.globalAlpha = Math.min(1, (B.lv + 0.75) / 4.4);
      ctx.strokeStyle = 'hsl(' + B.hue + ',' + B.sat + '%,' + B.lig + '%)';
      ctx.lineWidth = (B.w / B.n) * (0.45 + 0.14 * B.lv);
      ctx.beginPath();
      for (var si = 0; si < B.d.length; si += 4) {
        ctx.moveTo(B.d[si + 2], B.d[si + 3]);
        ctx.lineTo(B.d[si], B.d[si + 1]);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ==========================================================
  //  彩带 / 纸屑
  // ==========================================================
  var confetti = [];
  var CONF_HUE = [345, 12, 42, 190, 285, 150, 320, 55];

  function spawnConfetti(n, fromTop) {
    for (var i = 0; i < n; i++) {
      if (confetti.length > 150) break;
      confetti.push({
        x: fromTop ? rand(-0.1 * W, 1.1 * W) : rand(-0.05 * W, 1.05 * W),
        y: fromTop ? rand(-H * 0.6, -10) : rand(-H * 0.2, 0),
        vx: rand(-0.5, 0.5),
        vy: rand(0.7, 2.4),
        rot: rand(0, TAU),
        vr: rand(-0.16, 0.16),
        w: rand(3, 7),
        h: rand(6, 13),
        hue: CONF_HUE[(Math.random() * CONF_HUE.length) | 0],
        ph: rand(0, TAU),
        sw: rand(0.4, 1.5),
        ribbon: Math.random() < 0.35
      });
    }
  }

  function updateConfetti(dt) {
    var f = Math.min(dt / 16.667, 3);
    for (var i = confetti.length - 1; i >= 0; i--) {
      var c = confetti[i];
      c.vy += 0.012 * f;
      if (c.vy > 3.4) c.vy = 3.4;
      c.y += c.vy * f;
      c.x += (c.vx + Math.sin(clockMs * 0.0011 + c.ph) * 0.9 * c.sw) * f;
      c.rot += c.vr * f;
      if (c.y > H + 40) confetti.splice(i, 1);
    }
  }

  function drawConfetti(alpha) {
    if (!confetti.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < confetti.length; i++) {
      var c = confetti[i];
      ctx.globalAlpha = 0.82 * alpha;
      ctx.fillStyle = 'hsl(' + c.hue + ',88%,66%)';
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      if (c.ribbon) {
        ctx.beginPath();
        ctx.moveTo(-c.w / 2, -c.h / 2);
        ctx.quadraticCurveTo(c.w * 1.4, 0, -c.w / 2, c.h / 2);
        ctx.lineTo(c.w / 2, c.h / 2);
        ctx.quadraticCurveTo(c.w * 0.2, 0, c.w / 2, -c.h / 2);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // ==========================================================
  //  暖场画面：蛋糕 / 小熊 / 气球 / 彩灯 / 霓虹
  // ==========================================================
  var SC = null;
  var BALL_SPR = [];

  function newCv(w, h, sc) {
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * (sc || 2)));
    c.height = Math.max(1, Math.round(h * (sc || 2)));
    var x = c.getContext('2d');
    x.scale(sc || 2, sc || 2);
    return { c: c, x: x, w: w, h: h };
  }

  // ---------- 蛋糕 ----------
  function renderCake(hgt) {
    var w = hgt * 1.34;
    var o = newCv(w, hgt, 2), c = o.x;
    var cx = w / 2;
    var ryB = w * 0.098;      // 下层顶面椭圆短轴
    var ryT = w * 0.076;      // 上层

    // ---- 落地投影 ----
    var sh = c.createRadialGradient(cx, hgt * 0.948, hgt * 0.02, cx, hgt * 0.948, w * 0.56);
    sh.addColorStop(0, 'rgba(0,0,0,0.50)');
    sh.addColorStop(0.48, 'rgba(0,0,0,0.22)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sh;
    c.beginPath();
    c.ellipse(cx, hgt * 0.948, w * 0.56, hgt * 0.052, 0, 0, TAU);
    c.fill();

    // ---- 瓷盘 ----
    var py = hgt * 0.905, prx = w * 0.512, pry = hgt * 0.038;
    var pg = c.createLinearGradient(0, py - pry * 0.4, 0, py + pry * 2.2);
    pg.addColorStop(0, '#fffaef');
    pg.addColorStop(0.28, '#f0dcbf');
    pg.addColorStop(0.62, '#c9a273');
    pg.addColorStop(1, '#7e5429');
    c.fillStyle = pg;
    c.beginPath();
    c.ellipse(cx, py + pry * 0.50, prx, pry, 0, 0, TAU);
    c.fill();
    var pg2 = c.createRadialGradient(cx - prx * 0.28, py - pry * 0.6, pry * 0.12, cx, py, prx);
    pg2.addColorStop(0, '#ffffff');
    pg2.addColorStop(0.52, '#fbf1e2');
    pg2.addColorStop(1, '#d8b78f');
    c.fillStyle = pg2;
    c.beginPath();
    c.ellipse(cx, py, prx, pry, 0, 0, TAU);
    c.fill();
    c.strokeStyle = 'rgba(255,242,208,0.95)';
    c.lineWidth = Math.max(1, hgt * 0.005);
    c.beginPath();
    c.ellipse(cx, py, prx * 0.955, pry * 0.90, 0, 0, TAU);
    c.stroke();
    c.strokeStyle = 'rgba(150,102,54,0.28)';
    c.lineWidth = Math.max(0.7, hgt * 0.0024);
    c.beginPath();
    c.ellipse(cx, py, prx * 0.83, pry * 0.73, 0, 0, TAU);
    c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.65)';
    c.lineWidth = Math.max(0.8, hgt * 0.0032);
    c.beginPath();
    c.ellipse(cx, py, prx * 0.90, pry * 0.80, 0, Math.PI * 1.10, Math.PI * 1.90);
    c.stroke();

    // ---- 一层 ----
    function tier(y0, y1, x0, x1, ry, icingCol, drips) {
      var hw = (x1 - x0) / 2;

      // 主体：奶油白，只在两侧收暗
      var bg = c.createLinearGradient(x0, 0, x1, 0);
      bg.addColorStop(0, '#e2c3a1');
      bg.addColorStop(0.10, '#f6e4cb');
      bg.addColorStop(0.30, '#fffbf4');
      bg.addColorStop(0.50, '#fffdfa');
      bg.addColorStop(0.70, '#fdf3e3');
      bg.addColorStop(0.90, '#f3dcbe');
      bg.addColorStop(1, '#dcbb97');
      c.fillStyle = bg;
      c.beginPath();
      c.ellipse(cx, y0, hw, ry, 0, 0, Math.PI, false);
      c.lineTo(x0, y1);
      c.ellipse(cx, y1, hw, ry, 0, Math.PI, 0, true);
      c.closePath();
      c.fill();

      // 抹刀痕：极淡的宽弧，不要平行细线
      c.save();
      c.beginPath();
      c.ellipse(cx, y0, hw, ry, 0, 0, Math.PI, false);
      c.lineTo(x0, y1);
      c.ellipse(cx, y1, hw, ry, 0, Math.PI, 0, true);
      c.closePath();
      c.clip();

      var band = hw / 6.5;
      for (var sx = x0 - band; sx < x1 + band; sx += band) {
        var kk = clamp((sx - x0) / (x1 - x0), 0, 1);
        var bulge = Math.sin(kk * Math.PI);
        c.strokeStyle = 'rgba(255,255,255,' + (0.05 + 0.11 * bulge).toFixed(3) + ')';
        c.lineWidth = band * 0.62;
        c.beginPath();
        c.moveTo(sx, y0 + ry * 0.5);
        c.quadraticCurveTo(sx + band * 0.30, (y0 + y1) * 0.52, sx + band * 0.16, y1);
        c.stroke();
        c.strokeStyle = 'rgba(176,124,74,' + (0.024 + 0.05 * bulge).toFixed(3) + ')';
        c.lineWidth = band * 0.16;
        c.beginPath();
        c.moveTo(sx + band * 0.78, y0 + ry * 0.5);
        c.quadraticCurveTo(sx + band * 1.02, (y0 + y1) * 0.52, sx + band * 0.88, y1);
        c.stroke();
      }

      // 底部沉影
      var bs = c.createLinearGradient(0, y1 - hgt * 0.10, 0, y1 + ry * 0.30);
      bs.addColorStop(0, 'rgba(120,72,34,0)');
      bs.addColorStop(1, 'rgba(92,52,20,0.34)');
      c.fillStyle = bs;
      c.fillRect(x0, y1 - hgt * 0.10, x1 - x0, hgt * 0.10 + ry * 0.30);
      c.restore();

      // 顶面（暖白，带一点俯视）
      var tg = c.createRadialGradient(cx - hw * 0.30, y0 - ry * 0.40, ry * 0.1, cx, y0 + ry * 0.2, hw * 1.05);
      tg.addColorStop(0, '#fff8ef');
      tg.addColorStop(0.5, '#fbeadb');
      tg.addColorStop(1, '#e7cfae');
      c.fillStyle = tg;
      c.beginPath();
      c.ellipse(cx, y0, hw, ry, 0, 0, TAU);
      c.fill();

      // 顶面奶油
      if (icingCol) {
        var ig = c.createRadialGradient(cx - hw * 0.30, y0 - ry * 0.45, ry * 0.1, cx, y0, hw * 1.02);
        ig.addColorStop(0, '#fff6f2');
        ig.addColorStop(0.42, icingCol);
        ig.addColorStop(1, icingCol);
        c.fillStyle = ig;
        c.beginPath();
        c.ellipse(cx, y0, hw * 1.005, ry * 1.02, 0, 0, TAU);
        c.fill();
        // 顶面内侧一圈淡影，避免顶面糊成一片白
        var nest = c.createRadialGradient(cx, y0, hw * 0.55, cx, y0, hw * 1.0);
        nest.addColorStop(0, 'rgba(190,120,130,0)');
        nest.addColorStop(1, 'rgba(190,120,130,0.16)');
        c.fillStyle = nest;
        c.beginPath();
        c.ellipse(cx, y0, hw * 1.005, ry * 1.02, 0, 0, TAU);
        c.fill();
      }

      // 挂边：圆头水滴，间隔清楚
      if (drips) {
        var n = Math.max(7, Math.round(hw / 17));
        for (var i = 0; i < n; i++) {
          var t = (i + 0.5) / n;
          var px = cx - hw * 0.93 + t * hw * 1.86;
          var ang = Math.asin(clamp((px - cx) / (hw * 1.005), -1, 1));
          var edgeY = y0 + Math.cos(ang) * ry * 0.94;
          var wob = Math.abs(Math.sin(i * 2.19 + 0.6));
          var len = ry * (0.55 + 1.25 * wob) * (0.55 + 0.55 * Math.sin(Math.PI * t));
          var rad = (hw / n) * (0.26 + 0.10 * Math.sin(i * 2.7 + 1));
          var dr = c.createLinearGradient(px, edgeY, px, edgeY + len + rad);
          dr.addColorStop(0, '#ffd3e0');
          dr.addColorStop(0.55, '#ffc2d3');
          dr.addColorStop(1, '#f9a9c0');
          c.fillStyle = dr;
          c.beginPath();
          c.moveTo(px - rad * 1.05, edgeY - ry * 0.22);
          c.quadraticCurveTo(px - rad * 0.98, edgeY + len * 0.55, px - rad, edgeY + len);
          c.arc(px, edgeY + len, rad, Math.PI, 0, true);
          c.quadraticCurveTo(px + rad * 0.98, edgeY + len * 0.55, px + rad * 1.05, edgeY - ry * 0.22);
          c.closePath();
          c.fill();
          // 滴身高光
          c.fillStyle = 'rgba(255,255,255,0.55)';
          c.beginPath();
          c.ellipse(px - rad * 0.36, edgeY + len * 0.30, rad * 0.26, Math.max(1, len * 0.26), 0.06, 0, TAU);
          c.fill();
        }
        // 顶面奶油的光泽
        c.strokeStyle = 'rgba(255,255,255,0.45)';
        c.lineWidth = Math.max(1, hgt * 0.006);
        c.beginPath();
        c.ellipse(cx, y0, hw * 0.90, ry * 0.90, 0, Math.PI * 1.08, Math.PI * 1.92);
        c.stroke();
      }

      // 层脚奶油裱花
      var pn = Math.max(13, Math.round(hw / 8));
      var pr2 = hw / pn * 0.60;
      for (var pi3 = 0; pi3 < pn; pi3++) {
        var pt2 = (pi3 + 0.5) / pn;
        var qx = cx - hw * 0.996 + pt2 * hw * 1.992;
        var qang = Math.asin(clamp((qx - cx) / (hw * 0.996), -1, 1));
        var qy = y1 + Math.cos(qang) * ry * 0.92;
        var cgr = c.createRadialGradient(qx - pr2 * 0.32, qy - pr2 * 0.55, pr2 * 0.08, qx, qy, pr2 * 1.12);
        cgr.addColorStop(0, '#ffffff');
        cgr.addColorStop(0.55, '#fdf4e8');
        cgr.addColorStop(1, '#e6c9a4');
        c.fillStyle = cgr;
        c.beginPath();
        c.arc(qx, qy, pr2, Math.PI, TAU);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.5)';
        c.beginPath();
        c.ellipse(qx - pr2 * 0.32, qy - pr2 * 0.40, pr2 * 0.30, pr2 * 0.20, -0.5, 0, TAU);
        c.fill();
      }
    }

    tier(hgt * 0.449, hgt * 0.900, w * 0.090, w * 0.910, ryB, '#ffe4eb', false);

    // 上层压在下层上的接触阴影
    var ag = c.createRadialGradient(cx, hgt * 0.497, w * 0.06, cx, hgt * 0.500, w * 0.30);
    ag.addColorStop(0, 'rgba(150,92,48,0.26)');
    ag.addColorStop(0.7, 'rgba(150,92,48,0.10)');
    ag.addColorStop(1, 'rgba(150,92,48,0)');
    c.fillStyle = ag;
    c.beginPath();
    c.ellipse(cx, hgt * 0.499, w * 0.285, ryB * 0.92, 0, 0, TAU);
    c.fill();

    tier(hgt * 0.120, hgt * 0.499, w * 0.248, w * 0.752, ryT, '#ffc2d4', true);

    // ---- 顶面奶油花环 ----
    var ringN = 9;
    for (var ri = 0; ri < ringN; ri++) {
      var ra = (ri / ringN) * TAU;
      var rxs = w * 0.178, rys = ryT * 0.80;
      var rx2 = cx + Math.cos(ra) * rxs;
      var ry2 = hgt * 0.120 + Math.sin(ra) * rys;
      var rr2 = w * 0.019;
      var fgr = c.createRadialGradient(rx2 - rr2 * 0.35, ry2 - rr2 * 0.45, rr2 * 0.08, rx2, ry2, rr2 * 1.15);
      fgr.addColorStop(0, '#ffffff');
      fgr.addColorStop(0.55, '#fff6ec');
      fgr.addColorStop(1, '#f0d9bd');
      c.fillStyle = fgr;
      c.beginPath();
      c.arc(rx2, ry2, rr2, 0, TAU);
      c.fill();
    }

    // ---- 樱桃 ----
    var berries = [[-0.128, 0.18], [0.128, 0.18], [-0.052, 0.52], [0.062, 0.50]];
    for (var bi = 0; bi < berries.length; bi++) {
      var bx = cx + berries[bi][0] * w;
      var by = hgt * 0.120 + ryT * berries[bi][1];
      var br = w * 0.021;
      var bgr = c.createRadialGradient(bx - br * 0.38, by - br * 0.45, br * 0.1, bx, by, br * 1.2);
      bgr.addColorStop(0, '#ff8fa8');
      bgr.addColorStop(0.42, '#e33a5f');
      bgr.addColorStop(1, '#7d0f28');
      c.fillStyle = bgr;
      c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.85)';
      c.beginPath(); c.ellipse(bx - br * 0.36, by - br * 0.44, br * 0.24, br * 0.16, -0.6, 0, TAU); c.fill();
    }

    // ---- 蜡烛 ----
    var flames = [];
    var cxs2 = [-0.168, 0, 0.168];
    var topY = hgt * 0.120;
    var chh = hgt * 0.125;
    var cw3 = w * 0.0196;
    for (var ci = 0; ci < 3; ci++) {
      var px2 = cx + cxs2[ci] * w;
      var footY = topY + ryT * (ci === 1 ? 0.10 : 0.42);

      // 蜡烛在顶面上的投影
      c.fillStyle = 'rgba(150,92,48,0.18)';
      c.beginPath();
      c.ellipse(px2 + cw3 * 0.7, footY + cw3 * 0.22, cw3 * 2.0, cw3 * 0.55, 0, 0, TAU);
      c.fill();

      // 金烛托
      var cg = c.createLinearGradient(px2 - cw3 * 1.8, 0, px2 + cw3 * 1.8, 0);
      cg.addColorStop(0, '#6f4a14');
      cg.addColorStop(0.26, '#f0d28c');
      cg.addColorStop(0.48, '#fff8e0');
      cg.addColorStop(0.72, '#dfb463');
      cg.addColorStop(1, '#6f4a14');
      c.fillStyle = cg;
      c.beginPath();
      c.moveTo(px2 - cw3 * 1.85, footY);
      c.lineTo(px2 + cw3 * 1.85, footY);
      c.lineTo(px2 + cw3 * 1.18, footY - cw3 * 0.42);
      c.lineTo(px2 + cw3 * 0.86, footY - cw3 * 0.42);
      c.lineTo(px2 + cw3 * 0.86, footY - cw3 * 0.86);
      c.lineTo(px2 - cw3 * 0.86, footY - cw3 * 0.86);
      c.lineTo(px2 - cw3 * 0.86, footY - cw3 * 0.42);
      c.lineTo(px2 - cw3 * 1.18, footY - cw3 * 0.42);
      c.closePath();
      c.fill();
      c.strokeStyle = 'rgba(255,250,224,0.7)';
      c.lineWidth = Math.max(0.6, cw3 * 0.09);
      c.beginPath();
      c.moveTo(px2 - cw3 * 1.7, footY - cw3 * 0.10);
      c.lineTo(px2 + cw3 * 1.7, footY - cw3 * 0.10);
      c.stroke();

      // 蜡体
      var bodyY = footY - cw3 * 0.86;
      var sg = c.createLinearGradient(px2 - cw3 / 2, 0, px2 + cw3 / 2, 0);
      sg.addColorStop(0, '#e5b3c1');
      sg.addColorStop(0.22, '#fffafc');
      sg.addColorStop(0.5, '#fff4f8');
      sg.addColorStop(0.8, '#f7dde6');
      sg.addColorStop(1, '#d39aad');
      c.fillStyle = sg;
      rr(c, px2 - cw3 / 2, bodyY - chh, cw3, chh, cw3 * 0.44);
      c.fill();

      // 螺旋金纹
      c.strokeStyle = 'rgba(226,182,110,0.40)';
      c.lineWidth = Math.max(0.8, cw3 * 0.13);
      for (var st = 0; st < 6; st++) {
        var yy = bodyY - chh * (0.10 + st * 0.16);
        c.beginPath();
        c.moveTo(px2 - cw3 / 2, yy);
        c.quadraticCurveTo(px2, yy - cw3 * 0.55, px2 + cw3 / 2, yy - cw3 * 0.26);
        c.stroke();
      }

      // 烛芯
      var wickTop = bodyY - chh - cw3 * 0.75;
      c.strokeStyle = '#2e1b06';
      c.lineWidth = Math.max(1.4, cw3 * 0.30);
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(px2, bodyY - chh);
      c.lineTo(px2, wickTop);
      c.stroke();
      c.lineCap = 'butt';

      flames.push({ x: px2, y: wickTop, r: cw3 * 1.10 });
    }

    return { img: o.c, w: w, h: hgt, flames: flames };
  }

  // ---------- 小熊 ----------
  function renderBear(hgt) {
    var w = hgt * 0.92;
    var o = newCv(w, hgt, 2), c = o.x;
    var cx = w / 2;

    var sh = c.createRadialGradient(cx, hgt * 0.96, 2, cx, hgt * 0.96, w * 0.5);
    sh.addColorStop(0, 'rgba(0,0,0,0.45)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sh;
    c.beginPath();
    c.ellipse(cx, hgt * 0.96, w * 0.48, hgt * 0.04, 0, 0, TAU);
    c.fill();

    var fur = c.createLinearGradient(0, 0, w, hgt);
    fur.addColorStop(0, '#c78a55');
    fur.addColorStop(0.45, '#a96b38');
    fur.addColorStop(1, '#7a4720');

    // 身体
    c.fillStyle = fur;
    c.beginPath();
    c.ellipse(cx, hgt * 0.665, w * 0.325, hgt * 0.30, 0, 0, TAU);
    c.fill();

    // 肚皮
    var belly = c.createRadialGradient(cx - w * 0.05, hgt * 0.66, 2, cx, hgt * 0.70, w * 0.26);
    belly.addColorStop(0, '#f0cfa5');
    belly.addColorStop(1, 'rgba(224,178,131,0)');
    c.fillStyle = belly;
    c.beginPath();
    c.ellipse(cx, hgt * 0.70, w * 0.20, hgt * 0.19, 0, 0, TAU);
    c.fill();

    // 脚
    c.fillStyle = '#8f5a2c';
    c.beginPath(); c.ellipse(cx - w * 0.20, hgt * 0.925, w * 0.115, hgt * 0.055, -0.15, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(cx + w * 0.20, hgt * 0.925, w * 0.115, hgt * 0.055, 0.15, 0, TAU); c.fill();
    c.fillStyle = '#e9bd8e';
    c.beginPath(); c.ellipse(cx - w * 0.20, hgt * 0.922, w * 0.058, hgt * 0.028, -0.15, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(cx + w * 0.20, hgt * 0.922, w * 0.058, hgt * 0.028, 0.15, 0, TAU); c.fill();

    // 手臂（贴着身体，末端有肉垫）
    for (var ai = 0; ai < 2; ai++) {
      var sgn = ai ? 1 : -1;
      c.save();
      c.translate(cx + sgn * w * 0.255, hgt * 0.585);
      c.rotate(sgn * 0.30);
      c.fillStyle = fur;
      c.beginPath();
      c.ellipse(0, 0, w * 0.098, hgt * 0.150, 0, 0, TAU);
      c.fill();
      c.fillStyle = '#e3b389';
      c.beginPath();
      c.ellipse(0, hgt * 0.108, w * 0.072, hgt * 0.055, 0, 0, TAU);
      c.fill();
      c.fillStyle = 'rgba(150,95,50,0.55)';
      c.beginPath();
      c.arc(0, hgt * 0.100, w * 0.020, 0, TAU);
      c.fill();
      c.restore();
    }

    // 耳朵
    c.fillStyle = '#9a6231';
    c.beginPath(); c.arc(cx - w * 0.205, hgt * 0.175, w * 0.088, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx + w * 0.205, hgt * 0.175, w * 0.088, 0, TAU); c.fill();
    c.fillStyle = '#e3b389';
    c.beginPath(); c.arc(cx - w * 0.205, hgt * 0.175, w * 0.048, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx + w * 0.205, hgt * 0.175, w * 0.048, 0, TAU); c.fill();

    // 头
    c.fillStyle = fur;
    c.beginPath(); c.arc(cx, hgt * 0.295, w * 0.255, 0, TAU); c.fill();

    // 口鼻
    c.fillStyle = '#eec9a0';
    c.beginPath(); c.ellipse(cx, hgt * 0.335, w * 0.135, hgt * 0.095, 0, 0, TAU); c.fill();

    // 鼻
    c.fillStyle = '#3a2415';
    c.beginPath();
    c.moveTo(cx, hgt * 0.303);
    c.quadraticCurveTo(cx + w * 0.042, hgt * 0.300, cx + w * 0.032, hgt * 0.320);
    c.quadraticCurveTo(cx, hgt * 0.338, cx - w * 0.032, hgt * 0.320);
    c.quadraticCurveTo(cx - w * 0.042, hgt * 0.300, cx, hgt * 0.303);
    c.fill();

    // 嘴
    c.strokeStyle = '#4b2d1a';
    c.lineWidth = Math.max(1, w * 0.012);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(cx, hgt * 0.332);
    c.lineTo(cx, hgt * 0.345);
    c.moveTo(cx, hgt * 0.345);
    c.quadraticCurveTo(cx - w * 0.045, hgt * 0.372, cx - w * 0.072, hgt * 0.345);
    c.moveTo(cx, hgt * 0.345);
    c.quadraticCurveTo(cx + w * 0.045, hgt * 0.372, cx + w * 0.072, hgt * 0.345);
    c.stroke();

    // 眼睛
    c.fillStyle = '#2b1a0e';
    c.beginPath(); c.arc(cx - w * 0.093, hgt * 0.268, w * 0.030, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx + w * 0.093, hgt * 0.268, w * 0.030, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.9)';
    c.beginPath(); c.arc(cx - w * 0.083, hgt * 0.258, w * 0.011, 0, TAU); c.fill();
    c.beginPath(); c.arc(cx + w * 0.103, hgt * 0.258, w * 0.011, 0, TAU); c.fill();

    // 腮红
    c.fillStyle = 'rgba(240,130,140,0.30)';
    c.beginPath(); c.ellipse(cx - w * 0.185, hgt * 0.315, w * 0.048, hgt * 0.028, 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(cx + w * 0.185, hgt * 0.315, w * 0.048, hgt * 0.028, 0, 0, TAU); c.fill();

    // 领结
    c.fillStyle = '#e05a7a';
    c.beginPath();
    c.moveTo(cx, hgt * 0.44);
    c.lineTo(cx - w * 0.10, hgt * 0.408);
    c.lineTo(cx - w * 0.10, hgt * 0.472);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(cx, hgt * 0.44);
    c.lineTo(cx + w * 0.10, hgt * 0.408);
    c.lineTo(cx + w * 0.10, hgt * 0.472);
    c.closePath(); c.fill();
    c.fillStyle = '#ff7d99';
    c.beginPath(); c.arc(cx, hgt * 0.44, w * 0.030, 0, TAU); c.fill();

    return { img: o.c, w: w, h: hgt };
  }

  // ---------- 礼物盒 ----------
  function renderGift(hgt) {
    var w = hgt * 1.02;
    var o = newCv(w, hgt, 2), c = o.x;
    var bx = w * 0.08, bw = w * 0.84;
    var by = hgt * 0.22, bh = hgt * 0.72;

    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.beginPath(); c.ellipse(w / 2, hgt * 0.955, w * 0.48, hgt * 0.035, 0, 0, TAU); c.fill();

    var bg = c.createLinearGradient(bx, 0, bx + bw, 0);
    bg.addColorStop(0, '#8d3b52');
    bg.addColorStop(0.3, '#e37d97');
    bg.addColorStop(0.6, '#c25a76');
    bg.addColorStop(1, '#7d3145');
    c.fillStyle = bg;
    rr(c, bx, by, bw, bh, 3);
    c.fill();

    // 盖子
    c.fillStyle = '#b34c68';
    rr(c, bx - w * 0.05, by - hgt * 0.07, bw + w * 0.10, hgt * 0.14, 3);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.16)';
    rr(c, bx - w * 0.05, by - hgt * 0.07, bw + w * 0.10, hgt * 0.045, 3);
    c.fill();

    // 缎带
    var rg = c.createLinearGradient(0, 0, 0, hgt);
    rg.addColorStop(0, '#ffe4b0');
    rg.addColorStop(0.5, '#f2c368');
    rg.addColorStop(1, '#c99a3e');
    c.fillStyle = rg;
    c.fillRect(w / 2 - w * 0.055, by - hgt * 0.08, w * 0.11, bh + hgt * 0.08);
    c.fillRect(bx - w * 0.05, by + hgt * 0.11, bw + w * 0.10, hgt * 0.10);

    // 蝴蝶结
    c.fillStyle = '#f7cf7e';
    c.beginPath();
    c.ellipse(w * 0.34, by - hgt * 0.13, w * 0.13, hgt * 0.055, -0.4, 0, TAU);
    c.fill();
    c.beginPath();
    c.ellipse(w * 0.66, by - hgt * 0.13, w * 0.13, hgt * 0.055, 0.4, 0, TAU);
    c.fill();
    c.fillStyle = '#ffe9b8';
    c.beginPath(); c.arc(w * 0.5, by - hgt * 0.12, w * 0.045, 0, TAU); c.fill();

    return { img: o.c, w: w, h: hgt };
  }

  // ---------- 气球 ----------
  function renderBalloon(hue, lig) {
    var w = 100, h = 132;
    var o = newCv(w, h, 2), c = o.x;
    c.translate(w / 2, 58);
    c.rotate(0);

    var g = c.createRadialGradient(-14, -20, 4, 0, 0, 54);
    g.addColorStop(0, 'hsl(' + hue + ',95%,90%)');
    g.addColorStop(0.45, 'hsl(' + hue + ',76%,' + lig + '%)');
    g.addColorStop(1, 'hsl(' + hue + ',62%,' + (lig - 22) + '%)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, 40, 47, 0, 0, TAU);
    c.fill();

    // 高光
    c.fillStyle = 'rgba(255,255,255,0.55)';
    c.beginPath();
    c.ellipse(-13, -20, 11, 16, -0.42, 0, TAU);
    c.fill();
    c.globalAlpha = 0.3;
    c.beginPath();
    c.ellipse(9, 22, 14, 8, 0.5, 0, TAU);
    c.fill();
    c.globalAlpha = 1;

    // 结
    c.fillStyle = 'hsl(' + hue + ',80%,' + (lig - 30) + '%)';
    c.beginPath();
    c.moveTo(0, 46);
    c.lineTo(-6, 56);
    c.lineTo(6, 56);
    c.closePath();
    c.fill();

    return { img: o.c, w: w, h: h };
  }

  // ---------- 霓虹灯 ----------
  function buildNeon(text, fs, hue, weight) {
    var family = '"Helvetica Neue","Arial Black",Arial,sans-serif';
    var probe = document.createElement('canvas').getContext('2d');
    probe.font = weight + ' ' + fs + 'px ' + family;
    var tw = probe.measureText(text).width;

    var pad = fs * 1.5;
    var cw = tw + pad * 2, ch = fs * 2.6;
    var o = newCv(cw, ch, 2), c = o.x;
    c.font = weight + ' ' + fs + 'px ' + family;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    var mx = cw / 2, my = ch / 2;

    // 外晕
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 3; i++) {
      c.shadowColor = 'hsla(' + hue + ',100%,65%,1)';
      c.shadowBlur = fs * (0.55 + i * 0.45);
      c.fillStyle = 'hsla(' + hue + ',100%,' + (62 + i * 6) + '%,' + (0.30 + i * 0.16) + ')';
      c.fillText(text, mx, my);
    }
    c.restore();

    // 管芯
    c.save();
    c.shadowColor = 'hsla(' + hue + ',100%,72%,1)';
    c.shadowBlur = fs * 0.30;
    c.lineWidth = Math.max(1.6, fs * 0.055);
    c.strokeStyle = 'hsla(' + hue + ',70%,92%,0.95)';
    c.strokeText(text, mx, my);
    c.lineWidth = Math.max(0.8, fs * 0.022);
    c.strokeStyle = 'rgba(255,255,255,0.98)';
    c.strokeText(text, mx, my);
    c.restore();

    return { img: o.c, w: cw, h: ch };
  }

  function buildScene() {
    var narrow = W < 780;
    var ground = narrow ? H * 0.665 : H * 0.878;

    // 蛋糕是主角：正中、最大
    var cakeH = narrow ? Math.min(H * 0.212, W * 0.545) : Math.min(H * 0.345, W * 0.236);
    var cakeX = W * 0.5;
    var cakeBase = narrow ? H * 0.800 : ground + H * 0.012;

    // 水晶灯退到左侧当配角
    var lantH = narrow ? Math.min(H * 0.150, W * 0.330) : Math.min(H * 0.500, W * 0.325);
    var lantX = narrow ? W * 0.135 : W * 0.178;
    var lantBase = narrow ? H * 0.700 : ground;

    // 小熊挪到右侧
    var bearH = narrow ? Math.min(H * 0.118, W * 0.285) : Math.min(H * 0.300, W * 0.205);
    var bearX = narrow ? W * 0.862 : W * 0.828;
    var bearBase = narrow ? H * 0.712 : ground - H * 0.004;

    var giftH = narrow ? H * 0.070 : Math.min(H * 0.120, W * 0.078);

    var cake = renderCake(cakeH);
    var bear = renderBear(bearH);
    var gift = renderGift(giftH);

    var nf = narrow ? Math.min(H * 0.052, W * 0.105) : Math.min(H * 0.085, W * 0.058);
    var neon = buildNeon('HAPPY BIRTHDAY', nf, 335, '800');
    var neon2 = buildNeon('生日快乐', nf * 0.42, 42, '700');

    var nk = Math.min(1, (W * 0.90) / neon.w);
    neon.k = nk;
    neon2.k = Math.min(1, (W * 0.55) / neon2.w);
    var neonY = narrow ? H * 0.075 : H * 0.115;
    var neonX = W * 0.5 - (narrow ? W * 0.02 : W * 0.02);

    // 气球
    BALL_SPR = [];
    var bh = [348, 8, 36, 322, 288, 24];
    for (var i = 0; i < bh.length; i++) BALL_SPR.push(renderBalloon(bh[i], 70));

    var balloons = [];
    var cluster = narrow
      ? [[0.12, 0.13], [0.88, 0.12], [0.06, 0.30], [0.94, 0.28]]
      : [[0.09, 0.13], [0.15, 0.22], [0.055, 0.30], [0.20, 0.11],
         [0.91, 0.12], [0.96, 0.24], [0.855, 0.20], [0.885, 0.33],
         [0.30, 0.09], [0.70, 0.085]];
    for (var b = 0; b < cluster.length; b++) {
      balloons.push({
        x: cluster[b][0] * W,
        y: cluster[b][1] * H,
        s: (narrow ? 0.52 : 0.85) * rand(0.82, 1.18) * (Math.min(W, H) / 900 + 0.35),
        spr: b % BALL_SPR.length,
        ph: rand(0, TAU),
        sw: rand(6, 18),
        sp: rand(0.35, 0.75)
      });
    }

    // 彩灯串
    var strings = [
      { x0: -W * 0.05, y0: H * 0.02, x1: W * 1.05, y1: H * 0.055, sag: H * 0.10, ph: 0 },
      { x0: -W * 0.05, y0: H * 0.10, x1: W * 1.05, y1: H * 0.02, sag: H * 0.085, ph: 2.4 }
    ];

    // 散落在台面上的彩带
    var floorConf = [];
    for (var fc = 0; fc < 20; fc++) {
      floorConf.push({
        x: rand(W * 0.04, W * 0.96),
        y: rand(ground + H * 0.015, H * 0.985),
        rot: rand(0, TAU),
        w: rand(4, 9),
        h: rand(9, 20),
        hue: CONF_HUE[(Math.random() * CONF_HUE.length) | 0]
      });
    }

    // 背景虚焦光斑
    var bok = [];
    var bn = narrow ? 10 : 16;
    for (var k = 0; k < bn; k++) {
      bok.push({
        x: rand(0, W), y: rand(H * 0.03, ground),
        r: rand(26, 110) * (narrow ? 0.7 : 1),
        a: rand(0.05, 0.16),
        ph: rand(0, TAU),
        sp: rand(0.15, 0.5),
        hue: [42, 32, 20, 350][(Math.random() * 4) | 0]
      });
    }

    SC = {
      narrow: narrow, ground: ground, cake: cake, bear: bear, gift: gift,
      lant: { x: lantX, h: lantH, base: lantBase },
      cakePos: { x: cakeX, base: cakeBase },
      bearPos: { x: bearX, base: bearBase },
      giftA: { x: narrow ? W * 0.878 : W * 0.318, base: narrow ? H * 0.800 : ground - H * 0.002, s: narrow ? 0.66 : 0.95 },
      giftB: { x: narrow ? W * 0.062 : W * 0.700, base: narrow ? H * 0.792 : ground + H * 0.004, s: narrow ? 0.56 : 0.78 },
      neon: neon, neon2: neon2, neonX: neonX, neonY: neonY,
      balloons: balloons, strings: strings, bok: bok, floorConf: floorConf,
      bg: null
    };

    // 背景渐变
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#180a12');
    g.addColorStop(0.30, '#2c1017');
    g.addColorStop(0.58, '#4b1f12');
    g.addColorStop(0.74, '#5d2a13');
    g.addColorStop(1, '#1d0b05');
    SC.bg = g;
  }

  function drawFlame(x, y, r, now, ph, wind, windDir, ext) {
    wind = wind || 0;
    windDir = windDir || 1;
    ext = ext || 0;

    // 已经灭透：只留一点暗红余烬
    if (ext >= 0.985) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.20 + 0.08 * Math.sin(now * 0.004 + ph);
      ctx.fillStyle = '#e2521f';
      ctx.beginPath();
      ctx.arc(x, y + r * 0.34, r * 0.26, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = 'rgba(60,30,10,0.9)';
      ctx.beginPath();
      ctx.ellipse(x, y + r * 0.55, r * 0.34, r * 0.30, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
      return;
    }

    var alive = 1 - ext;
    var flick = 1 + 0.10 * Math.sin(now * 0.019 + ph) + 0.05 * Math.sin(now * 0.041 + ph * 2);
    var gust = 1 + 0.26 * Math.sin(now * 0.033 + ph * 3.1);
    var lean = windDir * wind * r * 5.4 * gust;
    var hh = r * 4.6 * flick * (1 - 0.46 * wind) * Math.pow(alive, 0.85);
    var ww = r * (2.2 + 1.15 * wind) * Math.pow(alive, 0.40);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    var hr = r * (12 - 3.5 * wind) * flick * alive;
    ctx.globalAlpha = 0.5 * Math.pow(alive, 0.65);
    ctx.drawImage(SPRITE_SOFT, x + lean * 0.3 - hr, y - hr - hh * 0.4, hr * 2, hr * 2);

    var fg = ctx.createRadialGradient(x + lean * 0.22, y - hh * 0.45, 0, x + lean * 0.12, y - hh * 0.35, hh * 0.95);
    fg.addColorStop(0, 'rgba(255,255,245,' + alive.toFixed(3) + ')');
    fg.addColorStop(0.35, 'rgba(255,232,160,' + (0.95 * alive).toFixed(3) + ')');
    fg.addColorStop(0.72, 'rgba(255,160,60,' + (0.55 * alive).toFixed(3) + ')');
    fg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(x + lean, y - hh);
    ctx.quadraticCurveTo(x + lean * 0.36 + ww, y - hh * 0.35, x, y + r * 0.3);
    ctx.quadraticCurveTo(x + lean * 0.36 - ww, y - hh * 0.35, x + lean, y - hh);
    ctx.fill();

    ctx.globalAlpha = Math.pow(alive, 0.45);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.ellipse(x + lean * 0.13, y - hh * 0.28, r * 0.55 * (1 - 0.28 * wind), r * 1.25 * alive, 0.06 * lean * 0.2, 0, TAU);
    ctx.fill();

    // 将灭未灭时的蓝焰
    if (ext > 0.08 && ext < 0.82) {
      var bp = Math.sin((ext - 0.08) / 0.74 * Math.PI);
      ctx.globalAlpha = bp * 0.65;
      ctx.fillStyle = 'rgba(150,205,255,0.95)';
      ctx.beginPath();
      ctx.ellipse(x, y - hh * 0.08, r * 0.68 * bp + r * 0.18, r * 0.95 * bp + r * 0.15, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function quadPt(p0, c, p1, t) {
    var u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * c.x + t * t * p1.x,
      y: u * u * p0.y + 2 * u * t * c.y + t * t * p1.y
    };
  }

  function drawScene(now, dt, dtf) {
    if (!SC) buildScene();

    // 背景
    ctx.fillStyle = SC.bg;
    ctx.fillRect(0, 0, W, H);

    // 墙面暖光
    var wg = ctx.createRadialGradient(W * 0.5, H * 0.52, 10, W * 0.5, H * 0.52, Math.max(W, H) * 0.66);
    wg.addColorStop(0, 'rgba(255,168,96,0.16)');
    wg.addColorStop(0.5, 'rgba(220,120,60,0.06)');
    wg.addColorStop(1, 'rgba(120,40,10,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // 巨鲸掠过
    if (ST.whaleA > 0.01) drawWhale(now, ST.whaleP, ST.whaleA);

    // 背景虚焦光斑
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < SC.bok.length; i++) {
      var b = SC.bok[i];
      var bx = b.x + Math.sin(now * 0.00022 * b.sp * 6 + b.ph) * 14;
      var by2 = b.y + Math.cos(now * 0.00017 * b.sp * 6 + b.ph) * 10;
      ctx.globalAlpha = b.a * (0.7 + 0.3 * Math.sin(now * 0.0009 + b.ph));
      var sp = b.hue > 300 ? SPRITE_PINK : SPRITE_SOFT;
      ctx.drawImage(sp, bx - b.r, by2 - b.r, b.r * 2, b.r * 2);
    }
    ctx.restore();

    // 台面
    var gy = SC.ground;
    var tg = ctx.createLinearGradient(0, gy - H * 0.10, 0, H);
    tg.addColorStop(0, 'rgba(126,70,32,0)');
    tg.addColorStop(0.28, 'rgba(112,60,26,0.58)');
    tg.addColorStop(1, 'rgba(34,14,5,0.94)');
    ctx.fillStyle = tg;
    ctx.fillRect(0, gy - H * 0.10, W, H - gy + H * 0.10);

    // 台面光池
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var poolX = SC.cakePos.x;
    var lp = ctx.createRadialGradient(poolX, gy, 6, poolX, gy, W * 0.55);
    lp.addColorStop(0, 'rgba(255,180,105,0.26)');
    lp.addColorStop(0.45, 'rgba(255,150,70,0.09)');
    lp.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = lp;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // 彩灯串
    for (var s = 0; s < SC.strings.length; s++) {
      var str = SC.strings[s];
      var p0 = { x: str.x0, y: str.y0 };
      var p1 = { x: str.x1, y: str.y1 };
      var cp = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 + str.sag * 2 };
      ctx.save();
      ctx.strokeStyle = 'rgba(58,32,14,0.65)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(cp.x, cp.y, p1.x, p1.y);
      ctx.stroke();

      var cnt = SC.narrow ? 16 : 28;
      for (var bi2 = 1; bi2 < cnt; bi2++) {
        var t = bi2 / cnt;
        var pt = quadPt(p0, cp, p1, t);
        var twk = 0.55 + 0.45 * Math.sin(now * 0.0022 + bi2 * 0.9 + s * 2.1);
        var br = (SC.narrow ? 4.5 : 6.5) * (0.8 + 0.35 * twk);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.85 * twk;
        ctx.drawImage(SPRITE_GOLD, pt.x - br * 2.6, pt.y - br * 2.6, br * 5.2, br * 5.2);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,250,232,' + (0.55 + 0.45 * twk) + ')';
        ctx.beginPath();
        ctx.ellipse(pt.x, pt.y + br * 0.5, br * 0.5, br * 0.78, 0, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
    }

    // 霓虹
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var flick = 0.92 + 0.08 * Math.sin(now * 0.0051);
    if (Math.sin(now * 0.00137) > 0.994) flick *= 0.45;
    ctx.globalAlpha = flick;
    ctx.drawImage(SC.neon.img,
      SC.neonX - SC.neon.w * SC.neon.k / 2, SC.neonY - SC.neon.h * SC.neon.k / 2,
      SC.neon.w * SC.neon.k, SC.neon.h * SC.neon.k);
    ctx.globalAlpha = flick * 0.75;
    var n2h = SC.neon2.h * SC.neon2.k;
    ctx.drawImage(SC.neon2.img,
      SC.neonX - SC.neon2.w * SC.neon2.k / 2,
      SC.neonY + SC.neon.h * SC.neon.k * (SC.narrow ? 0.62 : 0.30),
      SC.neon2.w * SC.neon2.k, n2h);
    ctx.restore();

    // 道具
    var lx = SC.lant.x, lb = SC.lant.base, lh = SC.lant.h;

    // 故事阶段先藏起配角，等鲸鱼娘退场后再淡入
    if (ST.propA > 0.01) {
      ctx.save();
      ctx.globalAlpha = ST.propA;
      // 礼物（后）
      drawProp(SC.gift, SC.giftB.x, SC.giftB.base, SC.giftB.s);
      drawProp(SC.gift, SC.giftA.x, SC.giftA.base, SC.giftA.s);
      // 小熊
      drawProp(SC.bear, SC.bearPos.x, SC.bearPos.base, 1);
      ctx.restore();
    }

    // 主礼盒
    if (ST.boxOn && ST.boxA > 0.02) {
      drawHeroBox(W / 2, ST.boxY, ST.boxW, ST.lidT, ST.boxGlow, ST.boxA);
    }
    drawBoxHint();

    // 躲在蛋糕后面的鲸鱼娘
    if (ST.backOn) drawCharLayer(false);

    // 蛋糕
    var cakeP = SC.cakePos;
    var ckImg = ST.cakeImg || SC.cake;
    if (ST.cakeA > 0.004) {
      ctx.save();
      ctx.globalAlpha = ST.cakeA;
      var ckW = ckImg.w * ST.cakeScale, ckH = ckImg.h * ST.cakeScale;
      ctx.drawImage(ckImg.img,
        cakeP.x - ckW / 2,
        cakeP.base - ckH + ST.cakeYOff,
        ckW, ckH);
      ctx.restore();
    }

    // 烛光在蛋糕上的一层暖晕（随剩余烛火增减）
    var litN = (1 - cdl.ext[0]) + (1 - cdl.ext[1]) + (1 - cdl.ext[2]);
    if (litN > 0.02 && ST.cakeA > 0.9 && ST.cakeScale === 1) {
      var cw0 = candleWorld(1);
      if (cw0) {
        var lr = SC.cake.h * 0.40 * (0.45 + 0.55 * litN / 3);
        var lgy = cw0.y + SC.cake.h * 0.10;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        var lg = ctx.createRadialGradient(cw0.x, lgy, 2, cw0.x, lgy, lr);
        lg.addColorStop(0, 'rgba(255,198,116,' + (0.13 * litN / 3).toFixed(3) + ')');
        lg.addColorStop(0.45, 'rgba(255,164,84,' + (0.055 * litN / 3).toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(255,140,60,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(cw0.x, lgy, lr, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    // 三根蜡烛的火苗（会被风吹歪，熄灭后剩余烬）
    for (var fi = 0; fi < 3; fi++) {
      if (ST.cakeA < 0.9 || ST.cakeScale !== 1) break;
      var cwf = candleWorld(fi);
      if (!cwf) continue;
      drawFlame(cwf.x, cwf.y, cwf.r, now, fi * 1.7 + 0.6, cdl.wind, cdl.windDir, cdl.ext[fi]);
    }
    drawSmoke();

    // 走到画面前面的鲸鱼娘
    if (ST.frontOn) drawCharLayer(true);

    // 水晶球灯（先落一圈接触阴影）
    ctx.save();
    var cs = ctx.createRadialGradient(lx, lb + 2, 2, lx, lb + 2, lh * 0.30);
    cs.addColorStop(0, 'rgba(0,0,0,0.55)');
    cs.addColorStop(0.55, 'rgba(0,0,0,0.22)');
    cs.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = cs;
    ctx.beginPath();
    ctx.ellipse(lx, lb + 3, lh * 0.30, lh * 0.045, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    drawLantern(lx, lb, lh, now, dtf);

    // 灯照在桌面上的反射光
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var rl = ctx.createRadialGradient(lx, lb, 2, lx, lb, lh * 0.9);
    rl.addColorStop(0, 'rgba(255,190,120,0.20)');
    rl.addColorStop(1, 'rgba(255,150,60,0)');
    ctx.fillStyle = rl;
    ctx.beginPath();
    ctx.ellipse(lx, lb + lh * 0.02, lh * 0.62, lh * 0.11, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 台面上散落的彩带
    for (var fci = 0; fci < SC.floorConf.length; fci++) {
      var fc2 = SC.floorConf[fci];
      ctx.save();
      ctx.translate(fc2.x, fc2.y);
      ctx.rotate(fc2.rot);
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = 'hsl(' + fc2.hue + ',60%,32%)';
      ctx.fillRect(-fc2.w / 2 + 1.5, -fc2.h / 2 + 2.5, fc2.w, fc2.h);
      ctx.globalAlpha = 0.62;
      ctx.fillStyle = 'hsl(' + fc2.hue + ',80%,58%)';
      ctx.fillRect(-fc2.w / 2, -fc2.h / 2, fc2.w, fc2.h);
      ctx.restore();
    }

    // 气球
    for (var bal = 0; bal < SC.balloons.length; bal++) {
      var bo = SC.balloons[bal];
      var spr = BALL_SPR[bo.spr];
      var sway = Math.sin(now * 0.00062 * bo.sp * 2 + bo.ph) * bo.sw;
      var bx2 = bo.x + sway;
      var by3 = bo.y + Math.sin(now * 0.00089 * bo.sp * 2 + bo.ph * 1.7) * bo.sw * 0.45;
      var bw = spr.w * bo.s, bh3 = spr.h * bo.s;

      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.drawImage(SPRITE_SOFT, bx2 - bw * 0.7, by3 - bw * 0.3, bw * 1.4, bw * 1.4);
      ctx.restore();

      ctx.drawImage(spr.img, bx2 - bw / 2, by3, bw, bh3);

      // 气球线
      var kx = bx2, ky = by3 + 56 * bo.s;
      var llen = H * (SC.narrow ? 0.12 : 0.15);
      var lsw = Math.sin(now * 0.0007 * bo.sp * 2 + bo.ph + 1) * 20 * bo.s;
      ctx.strokeStyle = 'rgba(255,226,186,0.13)';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(kx, ky);
      ctx.quadraticCurveTo(kx + lsw * 0.3, ky + llen * 0.55, kx + lsw, ky + llen);
      ctx.stroke();
    }
  }

  // ==========================================================
  //  声音：全部由 Web Audio 现场合成，不加载任何音频文件
  //   · 八音盒版《生日快乐》在蜡烛全灭那一刻完整响起
  //   · 风声跟着麦克风音量实时变大
  // ==========================================================
  var AUD = {
    ac: null, master: null, musicBus: null, sfxBus: null,
    muted: false, unlocked: false, noise: null,
    wind: null, windGain: null, windFilt: null,
    lastBoom: 0, lastLaunch: 0, countShown: -1, songOn: false
  };

  var NOTE_HZ = {
    G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99
  };

  // 房间混响的脉冲响应（噪声指数衰减）
  function audImpulse(ac, sec, decay) {
    var rate = ac.sampleRate, len = Math.max(1, Math.floor(rate * sec));
    var buf = ac.createBuffer(2, len, rate);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch);
      for (var i = 0; i < len; i++) {
        var t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
    }
    return buf;
  }

  function audNoiseBuf(ac, sec) {
    var rate = ac.sampleRate, len = Math.max(1, Math.floor(rate * sec));
    var buf = ac.createBuffer(1, len, rate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function audEnsureCtx() {
    if (AUD.ac) return AUD.ac;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    var ac;
    try { ac = new AC(); } catch (e) { return null; }
    AUD.ac = ac;

    // iPhone 侧边静音键：声明成 playback，尽量让声音出来
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e0) {}

    var master = ac.createGain();
    master.gain.value = 0.85;
    master.connect(ac.destination);
    AUD.master = master;

    var music = ac.createGain();
    music.gain.value = 0.72;
    music.connect(master);
    AUD.musicBus = music;

    // 让八音盒听起来像在一个房间里，而不是贴在耳朵上
    var verb = ac.createConvolver();
    verb.buffer = audImpulse(ac, 1.7, 3.0);
    var wet = ac.createGain();
    wet.gain.value = 0.34;
    verb.connect(wet);
    wet.connect(master);
    music.connect(verb);

    var sfx = ac.createGain();
    sfx.gain.value = 0.55;
    sfx.connect(master);
    AUD.sfxBus = sfx;

    AUD.noise = audNoiseBuf(ac, 2.0);
    audWindStart();
    return ac;
  }

  function audUnlock() {
    var ac = audEnsureCtx();
    if (!ac) return;
    if (ac.state === 'suspended' && ac.resume) {
      try { ac.resume(); } catch (e) {}
    }
    if (!AUD.unlocked) {
      AUD.unlocked = true;
      audWindStart();
    }
  }

  function audSetMuted(m) {
    AUD.muted = !!m;
    if (AUD.master && AUD.ac) {
      AUD.master.gain.setTargetAtTime(AUD.muted ? 0 : 0.85, AUD.ac.currentTime, 0.06);
    }
    var mt = document.getElementById('mute');
    if (mt) {
      if (AUD.muted) mt.classList.add('off');
      else mt.classList.remove('off');
    }
  }

  // 八音盒音色：正弦基频 + 高次泛音，高次衰减更快
  function audNote(freq, when, dur, vol, bus) {
    var ac = AUD.ac;
    if (!ac || AUD.muted) return;
    when = Math.max(when, ac.currentTime + 0.002);
    var out = ac.createGain();
    out.gain.setValueAtTime(0.0001, when);
    out.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), when + 0.007);
    out.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    out.connect(bus || AUD.musicBus);

    var P = [1, 2, 3.01, 4.04], A = [1, 0.29, 0.10, 0.042];
    for (var i = 0; i < P.length; i++) {
      var o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * P[i], when);
      var g = ac.createGain();
      g.gain.value = A[i];
      o.connect(g);
      g.connect(out);
      o.start(when);
      o.stop(when + dur + 0.03);
    }
  }

  function audBass(freq, when, dur, vol) {
    var ac = AUD.ac;
    if (!ac || AUD.muted) return;
    when = Math.max(when, ac.currentTime + 0.002);
    var o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, when);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.10);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g);
    g.connect(AUD.musicBus);
    o.start(when);
    o.stop(when + dur + 0.02);
  }

  // 《生日快乐》—— 3/4 拍，[音名, 拍数]
  function playBirthdaySong() {
    var ac = AUD.ac;
    if (!ac || AUD.muted || AUD.songOn) return;
    AUD.songOn = true;

    var beat = 0.50;
    var t0 = ac.currentTime + 0.62;
    var seq = [
      ['G4', 0.5], ['G4', 0.5], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
      ['G4', 0.5], ['G4', 0.5], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
      ['G4', 0.5], ['G4', 0.5], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
      ['F5', 0.5], ['F5', 0.5], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2]
    ];
    var t = t0;
    for (var i = 0; i < seq.length; i++) {
      var name = seq[i][0], beats = seq[i][1];
      var dur = beats * beat;
      // 每个音留一点余韵，八音盒不该断得太干
      var ring = Math.max(1.05, dur * 1.7);
      audNote(NOTE_HZ[name], t, ring, 0.275 * rand(0.90, 1.08));
      // 每句起点垫一个极轻的低八度
      if (i === 0 || i === 6 || i === 12 || i === 19) {
        audBass(NOTE_HZ[name] * 0.5, t, 2.5, 0.050);
      }
      t += dur;
    }
  }

  // 倒计时：每跳一个数字一声轻钟
  function sfxTick(high) {
    if (!AUD.ac || AUD.muted) return;
    audNote(high ? 1046.5 : 784.0, AUD.ac.currentTime + 0.01, 0.85, 0.095, AUD.sfxBus);
  }

  // 蜡烛熄灭「噗」
  function sfxPuff() {
    var ac = AUD.ac;
    if (!ac || AUD.muted) return;
    var t = ac.currentTime + 0.004;
    var src = ac.createBufferSource();
    src.buffer = AUD.noise;
    var f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(1650, t);
    f.frequency.exponentialRampToValueAtTime(210, t + 0.16);
    f.Q.value = 1.05;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.60, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.185);
    src.connect(f); f.connect(g); g.connect(AUD.sfxBus);
    src.start(t, rand(0, 1.4));
    src.stop(t + 0.21);
  }

  // 烟花升空：频率上扫的细啸叫
  function sfxLaunch() {
    var ac = AUD.ac;
    if (!ac || AUD.muted) return;
    if (ac.currentTime - AUD.lastLaunch < 0.105) return;
    AUD.lastLaunch = ac.currentTime;
    var t = ac.currentTime + 0.01;
    var o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(rand(320, 420), t);
    o.frequency.exponentialRampToValueAtTime(rand(1250, 1650), t + 0.60);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.64);
    o.connect(g); g.connect(AUD.sfxBus);
    o.start(t);
    o.stop(t + 0.68);
  }

  // 烟花炸开：噪声 + 低频「咚」，k 控制大小
  function sfxBoom(k) {
    var ac = AUD.ac;
    if (!ac || AUD.muted) return;
    var now = ac.currentTime;
    if (now - AUD.lastBoom < 0.042) return;
    AUD.lastBoom = now;

    k = k || 1;
    var t = now + 0.008;
    var vol = 0.40 * k;
    if (vol > 0.80) vol = 0.80;

    var src = ac.createBufferSource();
    src.buffer = AUD.noise;
    src.playbackRate.value = rand(0.72, 1.0);
    var f = ac.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(2700, t);
    f.frequency.exponentialRampToValueAtTime(280, t + 0.52);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.60);
    src.connect(f); f.connect(g); g.connect(AUD.sfxBus);
    src.start(t, rand(0, 1.2));
    src.stop(t + 0.64);

    var o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(92, t);
    o.frequency.exponentialRampToValueAtTime(36, t + 0.32);
    var og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * 0.9), t + 0.014);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.40);
    o.connect(og); og.connect(AUD.sfxBus);
    o.start(t);
    o.stop(t + 0.44);
  }

  // 吹气的风声：一个常驻的循环噪声，音量跟着 cdl.wind 走
  function audWindStart() {
    var ac = AUD.ac;
    if (!ac || AUD.wind) return;
    var src = ac.createBufferSource();
    src.buffer = AUD.noise;
    src.loop = true;
    var f = ac.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 700;
    f.Q.value = 0.68;
    var g = ac.createGain();
    g.gain.value = 0.0001;
    src.connect(f); f.connect(g); g.connect(AUD.sfxBus);
    src.start(0, rand(0, 1.0));
    AUD.wind = src;
    AUD.windGain = g;
    AUD.windFilt = f;
  }

  function audWindLevel(w) {
    if (!AUD.windGain || !AUD.ac) return;
    var ac = AUD.ac;
    var target = AUD.muted ? 0.0001 : Math.max(0.00012, w * 0.26);
    AUD.windGain.gain.setTargetAtTime(target, ac.currentTime, 0.055);
    if (AUD.windFilt) {
      AUD.windFilt.frequency.setTargetAtTime(520 + w * 950, ac.currentTime, 0.09);
    }
  }

  // 静音按钮
  function initAudioUI() {
    var btn = document.getElementById('mute');
    if (!btn) return;
    btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      e.preventDefault();
      audUnlock();
      audSetMuted(!AUD.muted);
    });

    // 任何一次真实交互都用来解锁音频（浏览器硬性要求）
    var once = function () {
      audUnlock();
      document.removeEventListener('pointerdown', once, true);
      document.removeEventListener('keydown', once, true);
    };
    document.addEventListener('pointerdown', once, true);
    document.addEventListener('keydown', once, true);

    // 切回页面时把被系统挂起的音频重新唤醒
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && AUD.ac && AUD.ac.state === 'suspended') audUnlock();
    });
  }

  // ==========================================================
  //  吹蜡烛：麦克风 / 指针扇风 / 点击
  // ==========================================================
  var cdl = {
    lit: [1, 1, 1],
    ext: [0, 0, 0],
    wind: 0,
    windDir: 1,
    blowAt: -1,
    allOut: false,
    allOutAt: 0,
    micOn: false,
    level: 0,
    base: 10,
    hot: 0,
    ac: null,
    analyser: null,
    data: null,
    sr: 44100
  };
  var smoke = [];

  // 精灵内坐标 → 屏幕坐标
  function candleWorld(i) {
    if (!SC || !SC.cake || !SC.cake.flames || !SC.cake.flames[i]) return null;
    var fm = SC.cake.flames[i], cp = SC.cakePos;
    return {
      x: cp.x - SC.cake.w / 2 + fm.x,
      y: cp.base - SC.cake.h + fm.y,
      r: fm.r
    };
  }

  function addSmoke(i) {
    var cw = candleWorld(i);
    if (!cw) return;
    for (var k = 0; k < 6; k++) {
      smoke.push({
        x: cw.x + rand(-1.4, 1.4), y: cw.y - rand(0, 3),
        vx: rand(-0.32, 0.32), vy: rand(-1.15, -0.55),
        r: cw.r * rand(0.45, 0.85), gr: rand(0.16, 0.38),
        life: 1, decay: rand(0.0040, 0.0072), ph: rand(0, TAU)
      });
    }
  }

  function updateSmoke(dt) {
    var f = Math.min(dt / 16.667, 3);
    for (var i = smoke.length - 1; i >= 0; i--) {
      var p = smoke[i];
      p.vx += Math.sin(clockMs * 0.0024 + p.ph) * 0.014 * f;
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.vy *= Math.pow(0.992, f);
      p.r += p.gr * f;
      p.life -= p.decay * f;
      if (p.life <= 0) smoke.splice(i, 1);
    }
  }

  function drawSmoke() {
    if (!smoke.length) return;
    ctx.save();
    for (var i = 0; i < smoke.length; i++) {
      var p = smoke[i];
      if (p.life <= 0) continue;
      var lf = p.life;
      var g = ctx.createRadialGradient(p.x - p.r * 0.25, p.y - p.r * 0.25, 0, p.x, p.y, p.r);
      g.addColorStop(0, 'rgba(228,224,220,' + (0.15 * lf).toFixed(3) + ')');
      g.addColorStop(0.40, 'rgba(206,200,196,' + (0.11 * lf).toFixed(3) + ')');
      g.addColorStop(0.72, 'rgba(180,174,172,' + (0.045 * lf).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(170,164,162,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function blowWind(amount, dir) {
    cdl.wind = Math.min(1.15, cdl.wind + amount);
    if (dir) cdl.windDir = dir;
  }

  function startBlow() {
    if (cdl.blowAt >= 0 || cdl.allOut) return;
    cdl.blowAt = 0;
  }

  function hitCandle(x, y) {
    for (var i = 0; i < 3; i++) {
      var c = candleWorld(i);
      if (!c) continue;
      var rx = Math.max(40, W * 0.042);
      var up = Math.max(64, H * 0.080);
      var dn = Math.max(42, H * 0.050);
      if (Math.abs(x - c.x) < rx && y > c.y - up && y < c.y + dn) return i;
    }
    return -1;
  }

  function updateCandles(dt) {
    var dtf = Math.min(dt / 16.667, 3);

    // ---- 麦克风 ----
    if (cdl.micOn && cdl.analyser && cdl.data) {
      cdl.analyser.getByteFrequencyData(cdl.data);
      var binHz = cdl.sr / cdl.analyser.fftSize;
      var lo = Math.max(1, Math.round(90 / binHz));
      var hi = Math.min(cdl.data.length - 2, Math.round(1500 / binHz));
      var sum = 0, cnt = 0;
      for (var i = lo; i <= hi; i++) { sum += cdl.data[i]; cnt++; }
      var lv = cnt ? sum / cnt : 0;
      cdl.level = lv;

      if (lv < cdl.base) cdl.base += (lv - cdl.base) * 0.32 * dtf;
      else cdl.base += 0.10 * dtf;
      cdl.base = clamp(cdl.base, 3, 90);

      var ratio = lv / Math.max(6, cdl.base);
      if (lv > 23 && ratio > 1.8) {
        cdl.hot += dt;
        blowWind(0.075 * dtf, null);
        if (cdl.hot > 110) startBlow();
      } else {
        cdl.hot = Math.max(0, cdl.hot - dt * 2.2);
      }
    }

    // ---- 风自然衰减 ----
    cdl.wind *= Math.pow(0.90, dtf);
    if (cdl.wind < 0.004) cdl.wind = 0;

    // ---- 依次熄灭（中间先灭）----
    if (cdl.blowAt >= 0) {
      cdl.blowAt += dt;
      var order = [1, 0, 2];
      for (var o = 0; o < 3; o++) {
        var idx = order[o];
        if (cdl.lit[idx] && cdl.blowAt > o * 145) {
          cdl.lit[idx] = 0;
          addSmoke(idx);
          sfxPuff();
        }
      }
    }

    for (var j = 0; j < 3; j++) {
      if (!cdl.lit[j]) cdl.ext[j] = Math.min(1, cdl.ext[j] + dt / 300);
    }

    updateSmoke(dt);
    audWindLevel(cdl.wind);

    if (!cdl.allOut && !cdl.lit[0] && !cdl.lit[1] && !cdl.lit[2] &&
        cdl.ext[0] > 0.98 && cdl.ext[1] > 0.98 && cdl.ext[2] > 0.98) {
      cdl.allOut = true;
      cdl.allOutAt = clockMs;
      onAllOut();
    }
  }

  // 全灭之后：一大轮自动烟花
  function superBarrage() {
    var n = W < 760 ? 17 : 28;
    for (var i = 0; i < n; i++) {
      queueShell(i * 62 + rand(0, 70), W * rand(0.03, 0.97), H * rand(0.05, 0.40), true);
    }
    queueShell(150, W * 0.50, H * 0.09, true);
    queueShell(330, W * 0.20, H * 0.15, true);
    queueShell(470, W * 0.80, H * 0.13, true);
    var t0 = n * 62 + 430;
    var m = W < 760 ? 8 : 13;
    for (var j = 0; j < m; j++) {
      queueShell(t0 + j * 92, W * rand(0.06, 0.94), H * rand(0.04, 0.32), true);
    }
  }

  function onAllOut() {
    superBarrage();
    spawnConfetti(W < 760 ? 96 : 160, true);
    setTip('愿望已经说出口了 · 生日快乐');
    sfxBoom(1.25);
    AUD.songOn = false;                 // 允许再完整放一遍
    audStopWindSoft();
    playBirthdaySong();
    setTimeout(function () { setEndUI(true); }, 9000);
  }

  function audStopWindSoft() {
    if (AUD.windGain && AUD.ac) {
      AUD.windGain.gain.setTargetAtTime(0.0001, AUD.ac.currentTime, 0.3);
    }
  }

  // ---- 提示 UI ----
  var blowEl = null, btnEl = null, tipEl = null, blowShown = false;

  function setTip(txt) {
    if (tipEl) tipEl.textContent = txt || '';
  }

  function showBlowUI() {
    if (!blowEl) return;
    blowEl.classList.add('on');
  }

  function initBlowUI() {
    blowEl = document.getElementById('blow');
    btnEl = document.getElementById('blowbtn');
    tipEl = document.getElementById('blowtxt');

    var secure = (location.protocol === 'https:' ||
                  location.hostname === 'localhost' ||
                  location.hostname === '127.0.0.1');
    var isWX = /MicroMessenger/i.test(navigator.userAgent);
    var canMic = secure && !isWX && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;

    if (!canMic) {
      if (btnEl) btnEl.style.display = 'none';
      setTip(isWX
        ? '手指在蜡烛上快速划一下 · 或点一下蜡烛'
        : '在蜡烛上快速划一下 · 或点一下蜡烛');
      if (tipEl) tipEl.classList.add('big');
    } else {
      setTip('');
    }

    if (btnEl) {
      btnEl.addEventListener('click', function (e) {
